<!DOCTYPE html>
<html lang="id">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>SINC Tomohon Cup - Hasil Atlet</title>

  <!-- QR SCANNER -->
  <script src="https://unpkg.com/html5-qrcode"></script>


  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background:
        linear-gradient(
          135deg,
          #071426,
          #101d3a,
          #162d55
        );

      min-height: 100vh;
      padding: 20px;
      color: #111827;
    }


    .container {
      width: 100%;
      max-width: 520px;
      margin: auto;
    }


    .header {
      text-align: center;
      color: white;
      margin-bottom: 18px;
    }


    .header h1 {
      margin: 0;
      font-size: 27px;
    }


    .header p {
      margin-top: 7px;
      opacity: 0.8;
      font-size: 14px;
    }


    .card {
      background: white;
      border-radius: 20px;
      padding: 20px;
      box-shadow:
        0 10px 30px
        rgba(0,0,0,0.25);

      margin-bottom: 18px;
    }


    .scanner-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 12px;
    }


    #reader {
      width: 100%;
      border-radius: 14px;
      overflow: hidden;
    }


    .button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 15px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }


    .button-scan {
      background: #111827;
      color: white;
    }


    .button-close {
      background: #e5e7eb;
      color: #111827;
    }


    .input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 14px;
      margin-top: 10px;
    }


    .button-search {
      background: #2563eb;
      color: white;
    }


    #result {
      display: none;
    }


    .athlete-name {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 15px;
    }


    .info {
      margin: 8px 0;
      font-size: 16px;
    }


    .info strong {
      display: inline-block;
      min-width: 125px;
    }


    .winner {
      margin-top: 20px;
      padding: 22px;
      border-radius: 15px;
      text-align: center;
      background: #fff7ed;
      border: 2px solid #fed7aa;
    }


    .winner .icon {
      font-size: 42px;
    }


    .winner .title {
      font-size: 28px;
      font-weight: 800;
      color: #9a3412;
      margin-top: 5px;
    }


    .status {
      margin-top: 15px;
      padding: 18px;
      border-radius: 14px;
      font-weight: bold;
    }


    .status-medal {
      background: #dcfce7;
      color: #166534;
    }


    .status-piagam {
      background: #dbeafe;
      color: #1e40af;
    }


    .status-belum {
      background: #fee2e2;
      color: #991b1b;
    }


    .error {
      display: none;
      background: #fee2e2;
      color: #991b1b;
      padding: 15px;
      border-radius: 12px;
      margin-top: 15px;
      font-weight: bold;
    }


    .loading {
      display: none;
      text-align: center;
      padding: 20px;
      font-weight: bold;
    }


    .footer {
      text-align: center;
      color: white;
      opacity: 0.65;
      font-size: 12px;
      margin-top: 15px;
    }

  </style>

</head>


<body>


<div class="container">


  <!-- HEADER -->

  <div class="header">

    <h1>🏆 SINC TOMOHON CUP</h1>

    <p>
      Sistem Informasi Hasil Atlet
    </p>

  </div>



  <!-- SCANNER -->

  <div class="card">

    <div class="scanner-title">
      📷 Scan QR ID Card Atlet
    </div>


    <div id="reader"></div>


    <button
      class="button button-scan"
      onclick="startScanner()"
      id="startButton"
    >
      📷 MULAI SCAN QR
    </button>


    <button
      class="button button-close"
      onclick="stopScanner()"
      id="stopButton"
      style="display:none;"
    >
      ✕ TUTUP SCANNER
    </button>


    <div style="
      margin-top:20px;
      text-align:center;
      font-weight:bold;
      color:#6b7280;
    ">
      ATAU
    </div>


    <input
      type="text"
      id="qrInput"
      class="input"
      placeholder="Tempel QR URL ArenaJawara di sini"
    >


    <button
      class="button button-search"
      onclick="searchManual()"
    >
      🔎 LIHAT HASIL ATLET
    </button>


    <div
      id="loading"
      class="loading"
    >
      ⏳ Mengambil data atlet...
    </div>


    <div
      id="error"
      class="error"
    ></div>

  </div>



  <!-- RESULT -->

  <div
    class="card"
    id="result"
  >

    <div
      class="athlete-name"
      id="nama"
    ></div>


    <div class="info">
      <strong>ID Atlet:</strong>
      <span id="idAtlet"></span>
    </div>


    <div class="info">
      <strong>Kontingen:</strong>
      <span id="kontingen"></span>
    </div>


    <div class="info">
      <strong>Kategori:</strong>
      <span id="kategori"></span>
    </div>


    <div class="info">
      <strong>Jenis Kelamin:</strong>
      <span id="jenisKelamin"></span>
    </div>



    <!-- JUARA -->

    <div class="winner">

      <div class="icon">
        🏆
      </div>

      <div
        class="title"
        id="statusJuara"
      >
        -
      </div>

    </div>



    <!-- MEDALI -->

    <div
      class="status status-medal"
      id="medaliBox"
    >

      🥇 MEDALI

      <div
        style="
          font-size:22px;
          margin-top:5px;
        "
        id="medali"
      >
        -
      </div>

    </div>



    <!-- PIAGAM -->

    <div
      class="status status-piagam"
      id="piagamBox"
    >

      📜 PIAGAM

      <div
        style="
          font-size:22px;
          margin-top:5px;
        "
        id="piagam"
      >
        -
      </div>

    </div>


  </div>


  <div class="footer">

    SINC Tomohon Cup<br>
    Athlete Result Verification

  </div>


</div>



<script>


// ============================================================
// URL API APPS SCRIPT
// ============================================================

const API_URL =
  'https://script.google.com/macros/s/AKfycbz2Gqo1Yhud50ODwXcoQokzEi3cF484EiTSz9FPp9JhtSiHBRZybTYKvsQsavDqAUGtwQ/exec';



let scanner = null;



// ============================================================
// MULAI SCANNER
// ============================================================

function startScanner() {

  if (scanner) {
    return;
  }


  scanner =
    new Html5Qrcode(
      "reader"
    );


  scanner
    .start(

      {
        facingMode: "environment"
      },

      {
        fps: 10,
        qrbox: {
          width: 250,
          height: 250
        }
      },

      function(decodedText) {

        stopScanner();

        loadAthlete(
          decodedText
        );

      },

      function(errorMessage) {

        // Abaikan error scan sementara

      }

    )
    .then(function() {

      document
        .getElementById(
          'startButton'
        )
        .style.display =
        'none';


      document
        .getElementById(
          'stopButton'
        )
        .style.display =
        'block';

    })
    .catch(function(error) {

      showError(
        'Kamera tidak dapat digunakan. Pastikan izin kamera sudah diberikan.'
      );

    });

}



// ============================================================
// STOP SCANNER
// ============================================================

function stopScanner() {

  if (!scanner) {
    return;
  }


  scanner
    .stop()
    .then(function() {

      scanner.clear();

      scanner = null;


      document
        .getElementById(
          'startButton'
        )
        .style.display =
        'block';


      document
        .getElementById(
          'stopButton'
        )
        .style.display =
        'none';

    })
    .catch(function() {

      scanner = null;

    });

}



// ============================================================
// MANUAL SEARCH
// ============================================================

function searchManual() {

  const qr =
    document
      .getElementById(
        'qrInput'
      )
      .value
      .trim();


  if (!qr) {

    showError(
      'Silakan masukkan QR URL terlebih dahulu.'
    );

    return;

  }


  loadAthlete(qr);

}



// ============================================================
// LOAD DATA ATLET
// ============================================================

function loadAthlete(qr) {

  hideError();

  showLoading();


  const callbackName =
    'athleteCallback_' +
    Date.now();


  window[callbackName] =
    function(response) {

      hideLoading();


      try {

        if (
          !response ||
          !response.success
        ) {

          showError(
            response &&
            response.error
              ? response.error
              : 'Data atlet tidak ditemukan.'
          );

          return;

        }


        displayAthlete(
          response.athlete
        );


      } catch(error) {

        showError(
          'Terjadi kesalahan saat membaca data.'
        );

      }


      delete window[
        callbackName
      ];

      if (
        script &&
        script.parentNode
      ) {

        script
          .parentNode
          .removeChild(
            script
          );

      }

    };


  const script =
    document.createElement(
      'script'
    );


  script.src =
    API_URL +
    '?action=lookup' +
    '&qr=' +
    encodeURIComponent(qr) +
    '&callback=' +
    callbackName;


  script.onerror =
    function() {

      hideLoading();

      showError(
        'Tidak dapat terhubung ke server.'
      );

      delete window[
        callbackName
      ];

      if (
        script.parentNode
      ) {

        script
          .parentNode
          .removeChild(
            script
          );

      }

    };


  document
    .body
    .appendChild(
      script
    );

}



// ============================================================
// TAMPILKAN DATA ATLET
// ============================================================

function displayAthlete(
  athlete
) {

  document
    .getElementById(
      'result'
    )
    .style.display =
    'block';


  document
    .getElementById(
      'nama'
    )
    .textContent =
    athlete.nama ||
    '-';


  document
    .getElementById(
      'idAtlet'
    )
    .textContent =
    athlete.idAtlet ||
    '-';


  document
    .getElementById(
      'kontingen'
    )
    .textContent =
    athlete.kontingen ||
    '-';


  document
    .getElementById(
      'kategori'
    )
    .textContent =
    athlete.kategori ||
    '-';


  document
    .getElementById(
      'jenisKelamin'
    )
    .textContent =
    athlete.jenisKelamin ||
    '-';


  document
    .getElementById(
      'statusJuara'
    )
    .textContent =
    athlete.statusJuara ||
    'BELUM DITENTUKAN';


  document
    .getElementById(
      'medali'
    )
    .textContent =
    athlete.medali ||
    'BELUM';


  document
    .getElementById(
      'piagam'
    )
    .textContent =
    athlete.piagam ||
    'BELUM';


  // Scroll ke hasil

  document
    .getElementById(
      'result'
    )
    .scrollIntoView({
      behavior: 'smooth'
    });

}



// ============================================================
// LOADING
// ============================================================

function showLoading() {

  document
    .getElementById(
      'loading'
    )
    .style.display =
    'block';

}


function hideLoading() {

  document
    .getElementById(
      'loading'
    )
    .style.display =
    'none';

}



// ============================================================
// ERROR
// ============================================================

function showError(
  message
) {

  const error =
    document
      .getElementById(
        'error'
      );


  error.textContent =
    '⚠️ ' + message;


  error.style.display =
    'block';

}


function hideError() {

  document
    .getElementById(
      'error'
    )
    .style.display =
    'none';

}


</script>


</body>
</html>
