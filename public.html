<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SINC Tomohon Cup - Hasil Atlet</title><script src="https://unpkg.com/html5-qrcode"></script><style>body{font-family:Arial;margin:0;background:linear-gradient(135deg,#071426,#162d55);min-height:100vh;padding:20px;color:#111827}.wrap{max-width:520px;margin:auto}.card{background:white;padding:20px;border-radius:20px;margin-bottom:16px;box-shadow:0 8px 25px #0003}h1{text-align:center;color:white}.btn,input{width:100%;padding:14px;margin-top:8px;box-sizing:border-box;border-radius:12px;font-size:16px}button{border:0;font-weight:bold}.scan{background:#111827;color:#fff}.close{background:#e5e7eb}.search{background:#2563eb;color:#fff}.name{font-size:27px;font-weight:bold}.info{margin:9px 0}.winner{margin-top:18px;padding:22px;text-align:center;background:#fff7ed;border:2px solid #fed7aa;border-radius:15px}.winner .t{font-size:28px;font-weight:bold;color:#9a3412}.weight{margin-top:15px;padding:18px;text-align:center;background:#f3f4f6;border-radius:15px}.kg{font-size:28px;font-weight:bold;margin:6px}.status{display:inline-block;padding:9px 13px;border-radius:10px;font-weight:bold}.pass{background:#dcfce7;color:#166534}.fail{background:#fee2e2;color:#991b1b}.pending{background:#fef3c7;color:#92400e}.err{display:none;margin-top:12px;padding:12px;background:#fee2e2;color:#991b1b;border-radius:10px;font-weight:bold}</style></head><body><div class="wrap"><h1>🏆 SINC TOMOHON CUP</h1><div class="card"><b>📷 Scan QR ID Card Atlet</b><div id="reader"></div><button id="start" class="btn scan" onclick="start()">📷 MULAI SCAN QR</button><button id="stop" class="btn close" style="display:none" onclick="stop()">✖ TUTUP SCANNER</button><div style="text-align:center;margin:18px">ATAU</div><input id="qr" placeholder="Tempel QR URL ArenaJawara"><button class="btn search" onclick="manual()">🔎 LIHAT HASIL ATLET</button><div id="err" class="err"></div></div><div id="result" class="card" style="display:none"><div id="nama" class="name"></div><div class="info"><b>ID Atlet:</b> <span id="id"></span></div><div class="info"><b>Kontingen:</b> <span id="kontingen"></span></div><div class="info"><b>Kategori:</b> <span id="kategori"></span></div><div class="info"><b>Jenis Kelamin:</b> <span id="gender"></span></div><div class="winner">🏆<div class="t" id="juara">BELUM DITENTUKAN</div></div><div class="weight"><b>⚖️ HASIL PENIMBANGAN</b><div class="kg" id="berat">-</div><div id="status" class="status pending">BELUM DIVERIFIKASI</div></div></div></div><script>const API='https://script.google.com/macros/s/AKfycbz2Gqo1Yhud50ODwXcoQokzEi3cF484EiTSz9FPp9JhtSiHBRZybTYKvsQsavDqAUGtwQ/exec';let s=null;function start(){if(s)return;s=new Html5Qrcode('reader');s.start({facingMode:'environment'},{fps:10,qrbox:250},t=>{stop();load(t)},()=>{}).then(()=>{startBtn(true)}).catch(()=>err('Kamera tidak dapat digunakan.'))}function startBtn(on){document.getElementById('start').style.display=on?'none':'block';document.getElementById('stop').style.display=on?'block':'none'}function stop(){if(!s)return;let x=s;s=null;x.stop().then(()=>{try{x.clear()}catch(e){};startBtn(false)}).catch(()=>startBtn(false))}function manual(){let q=document.getElementById('qr').value.trim();if(!q)return err('Masukkan QR URL terlebih dahulu.');load(q)}function load(qr){hideErr();let cb='pub'+Date.now(),sc=document.createElement('script');window[cb]=d=>{if(!d.success)return err(d.error);show(d.athlete);delete window[cb];sc.remove()};sc.src=API+'?action=lookup&qr='+encodeURIComponent(qr)+'&callback='+cb;sc.onerror=()=>{err('Server tidak dapat dihubungi.');delete window[cb];sc.remove()};document.body.appendChild(sc)}function show(a){document.getElementById('result').style.display='block';document.getElementById('nama').textContent=a.nama||'-';document.getElementById('id').textContent=a.idAtlet||'-';document.getElementById('kontingen').textContent=a.kontingen||'-';document.getElementById('kategori').textContent=a.kategori||'-';document.getElementById('gender').textContent=a.jenisKelamin||'-';document.getElementById('juara').textContent=a.statusJuara||'BELUM DITENTUKAN';document.getElementById('berat').textContent=a.hasilTimbang?a.hasilTimbang+' kg':'-';let st=String(a.statusTimbang||'BELUM DIVERIFIKASI').toUpperCase(),e=document.getElementById('status');e.textContent=st;e.className='status '+(st.includes('TIDAK')?'fail':st.includes('LOLOS')?'pass':'pending')}function err(t){let e=document.getElementById('err');e.textContent='⚠️ '+t;e.style.display='block'}function hideErr(){document.getElementById('err').style.display='none'}</script></body></html>
