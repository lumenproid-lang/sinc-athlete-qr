<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Piagam Otomatis TGM95</title>

<style>

/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    background: #333;
    font-family: Arial, Helvetica, sans-serif;
}


/* =========================================================
   PANEL KONTROL
========================================================= */

.control-panel {
    width: 100%;
    max-width: 700px;
    margin: 20px auto;
    background: white;
    padding: 20px;
    border-radius: 14px;
    box-shadow: 0 5px 25px rgba(0,0,0,.25);
}

.control-panel h2 {
    margin: 0 0 15px;
    text-align: center;
}

.input-row {
    display: flex;
    gap: 10px;
}

.input-row input {
    flex: 1;
    height: 48px;
    padding: 0 15px;
    font-size: 16px;
    border: 1px solid #ccc;
    border-radius: 8px;
}

button {
    height: 48px;
    padding: 0 20px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 15px;
    font-weight: bold;
}

.btn-cari {
    background: #111827;
    color: white;
}

.btn-print {
    background: #6d28d9;
    color: white;
    width: 100%;
    margin-top: 10px;
}

.btn-scan {
    background: #2563eb;
    color: white;
    width: 100%;
    margin-top: 10px;
}

.status {
    margin-top: 12px;
    padding: 10px;
    border-radius: 8px;
    background: #f3f4f6;
    text-align: center;
    font-size: 14px;
}

.error {
    background: #fee2e2;
    color: #991b1b;
}

.success {
    background: #dcfce7;
    color: #166534;
}


/* =========================================================
   AREA PIAGAM
========================================================= */

.preview-wrapper {
    display: flex;
    justify-content: center;
    margin: 25px auto;
}


/*
   UKURAN FISIK A4
   210mm x 297mm
*/

.piagam {
    position: relative;

    width: 210mm;
    height: 297mm;

    background-image: url("piagam.jpg");
    background-size: 210mm 297mm;
    background-repeat: no-repeat;
    background-position: center;

    background-color: white;

    overflow: hidden;
}


/* =========================================================
   TEXT
========================================================= */

.text {
    position: absolute;

    left: 105mm;

    width: 180mm;

    transform: translateX(-50%);

    text-align: center;

    color: #111;

    white-space: nowrap;
}


/* ---------------------------------------------------------
   NOMOR REGISTRASI
   FIX:
   X = 105mm
   Y = 126mm
--------------------------------------------------------- */

.nomor {
    top: 126mm;

    font-size: 4mm;

    font-weight: 400;
}


/* ---------------------------------------------------------
   NAMA
   FIX:
   X = 105mm
   Y = 141mm
--------------------------------------------------------- */

.nama {
    top: 141mm;

    font-size: 7mm;

    font-weight: 700;
}


/* ---------------------------------------------------------
   KONTINGEN
   FIX:
   X = 105mm
   Y = 150mm
--------------------------------------------------------- */

.kontingen {
    top: 150mm;

    font-size: 4.5mm;

    font-weight: 400;
}


/* ---------------------------------------------------------
   JUARA
   FIX:
   X = 105mm
   Y = 162mm
--------------------------------------------------------- */

.juara {
    top: 162mm;

    font-size: 7mm;

    font-weight: 700;
}


/* ---------------------------------------------------------
   KATEGORI
   FIX:
   X = 105mm
   Y = 170mm
--------------------------------------------------------- */

.kategori {
    top: 170mm;

    font-size: 4.5mm;

    font-weight: 400;
}


/* =========================================================
   SCANNER
========================================================= */

#scannerContainer {
    display: none;

    margin-top: 15px;

    text-align: center;
}

#reader {
    width: 100%;
    max-width: 500px;
    margin: auto;
}


/* =========================================================
   DATA HASIL
========================================================= */

.data-box {
    margin-top: 15px;
    padding: 15px;

    background: #f8fafc;

    border-radius: 10px;

    display: none;
}

.data-row {
    display: flex;

    margin-bottom: 6px;
}

.data-label {
    width: 140px;
    font-weight: bold;
}

.data-value {
    flex: 1;
}


/* =========================================================
   PRINT
========================================================= */

@page {
    size: A4 portrait;
    margin: 0;
}

@media print {

    html,
    body {
        width: 210mm;
        height: 297mm;

        margin: 0 !important;
        padding: 0 !important;

        background: white !important;
    }

    .control-panel,
    .data-box,
    #scannerContainer {
        display: none !important;
    }

    .preview-wrapper {
        margin: 0 !important;
        padding: 0 !important;

        display: block !important;
    }

    .piagam {
        display: block !important;

        width: 210mm !important;
        height: 297mm !important;

        margin: 0 !important;
        padding: 0 !important;

        page-break-after: avoid;
        page-break-before: avoid;

        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
    }
}

</style>
</head>


<body>


<!-- =======================================================
     PANEL KONTROL
======================================================= -->

<div class="control-panel">

    <h2>🏆 PIAGAM TGM95</h2>

    <div class="input-row">

        <input
            type="text"
            id="idAtlet"
            placeholder="Masukkan ID Atlet"
            autocomplete="off"
        >

        <button
            class="btn-cari"
            onclick="cariAtlet()"
        >
            CARI
        </button>

    </div>


    <button
        class="btn-scan"
        onclick="mulaiScan()"
    >
        📷 SCAN QR
    </button>


    <div id="scannerContainer">

        <div id="reader"></div>

        <button
            onclick="stopScan()"
            style="margin-top:10px;background:#dc2626;color:white;"
        >
            TUTUP SCANNER
        </button>

    </div>


    <div
        id="status"
        class="status"
    >
        Silakan masukkan ID Atlet atau scan QR.
    </div>


    <!-- DATA -->
    <div
        id="dataBox"
        class="data-box"
    >

        <div class="data-row">
            <div class="data-label">ID Atlet</div>
            <div
                class="data-value"
                id="viewId"
            ></div>
        </div>

        <div class="data-row">
            <div class="data-label">Nama</div>
            <div
                class="data-value"
                id="viewNama"
            ></div>
        </div>

        <div class="data-row">
            <div class="data-label">Kontingen</div>
            <div
                class="data-value"
                id="viewKontingen"
            ></div>
        </div>

        <div class="data-row">
            <div class="data-label">Juara</div>
            <div
                class="data-value"
                id="viewJuara"
            ></div>
        </div>

        <div class="data-row">
            <div class="data-label">Kategori</div>
            <div
                class="data-value"
                id="viewKategori"
            ></div>
        </div>

    </div>


    <button
        class="btn-print"
        onclick="printPiagam()"
    >
        🖨️ PRINT PIAGAM
    </button>

</div>



<!-- =======================================================
     PREVIEW PIAGAM
======================================================= -->

<div class="preview-wrapper">

    <div
        class="piagam"
        id="piagam"
    >

        <!-- NOMOR -->
        <div
            class="text nomor"
            id="txtNomor"
        ></div>


        <!-- NAMA -->
        <div
            class="text nama"
            id="txtNama"
        ></div>


        <!-- KONTINGEN -->
        <div
            class="text kontingen"
            id="txtKontingen"
        ></div>


        <!-- JUARA -->
        <div
            class="text juara"
            id="txtJuara"
        ></div>


        <!-- KATEGORI -->
        <div
            class="text kategori"
            id="txtKategori"
        ></div>

    </div>

</div>



<!-- =======================================================
     QR SCANNER LIBRARY
======================================================= -->

<script src="https://unpkg.com/html5-qrcode"></script>



<script>

/* =========================================================
   CONFIGURATION
========================================================= */


/*
   API APPS SCRIPT YANG SUDAH BERHASIL DIGUNAKAN
*/

const API =
'https://script.google.com/macros/s/AKfycbz2Gqo1Yhud500DwXcoQokzEi3cF484EiTSz9FPp9JhtSiHBRZybTYKvsQsavDqAUGtWQ/exec';


/*
   DEFAULT BACKGROUND

   File harus berada satu folder dengan piagam.html
*/

const BACKGROUND = 'piagam.jpg';


/* =========================================================
   GLOBAL DATA
========================================================= */

let athleteData = null;

let html5QrCode = null;

let scannerRunning = false;


/* =========================================================
   STATUS
========================================================= */

function setStatus(message, type = '') {

    const el = document.getElementById('status');

    el.textContent = message;

    el.className = 'status';

    if (type) {
        el.classList.add(type);
    }

}


/* =========================================================
   NORMALISASI ID
========================================================= */

function normalisasiId(value) {

    if (!value) return '';

    value = String(value).trim();

    /*
       Jika QR langsung berisi:

       CM-CC1EFFF7

       langsung digunakan.
    */

    if (/^CM-/i.test(value)) {

        return value;

    }


    /*
       Jika QR berisi URL seperti:

       https://arenajawara.id/verify/document/XXXXX

       atau URL lainnya,

       kita coba mencari ID Atlet.
    */

    try {

        const url = new URL(value);

        const params = url.searchParams;


        /*
           Coba parameter ID
        */

        const kemungkinan = [

            params.get('id'),

            params.get('idAtlet'),

            params.get('ID_Atlet'),

            params.get('athlete'),

            params.get('code')

        ];


        for (const item of kemungkinan) {

            if (
                item &&
                /^CM-/i.test(item)
            ) {

                return item.trim();

            }

        }


        /*
           Coba mencari CM-XXXXXXXX
           di seluruh URL
        */

        const match = value.match(
            /CM-[A-Z0-9]+/i
        );

        if (match) {

            return match[0];

        }

    } catch (error) {

        /*
           Bukan URL.
        */

    }


    /*
       Terakhir cari pola CM-
    */

    const match = value.match(
        /CM-[A-Z0-9]+/i
    );

    if (match) {

        return match[0];

    }


    /*
       Jika tidak ditemukan,
       kembalikan nilai asli.
    */

    return value;

}


/* =========================================================
   CARI ATLET
========================================================= */

async function cariAtlet(idOverride = null) {

    let id =
        idOverride ||
        document.getElementById('idAtlet').value.trim();


    if (!id) {

        setStatus(
            'Masukkan ID Atlet terlebih dahulu.',
            'error'
        );

        return;

    }


    /*
       NORMALISASI
    */

    id = normalisasiId(id);


    /*
       Tampilkan ID yang sudah dinormalisasi
    */

    document.getElementById('idAtlet').value = id;


    setStatus(
        '⏳ Mengambil data atlet...',
        ''
    );


    try {

        /*
           Endpoint lookup
        */

        const url =
            API +
            '?action=lookup&id=' +
            encodeURIComponent(id);


        const response =
            await fetch(
                url,
                {
                    method: 'GET',
                    cache: 'no-store'
                }
            );


        if (!response.ok) {

            throw new Error(
                'HTTP ' + response.status
            );

        }


        const data =
            await response.json();


        console.log(
            'RESPON API:',
            data
        );


        if (
            !data ||
            data.success !== true ||
            !data.athlete
        ) {

            throw new Error(
                data?.error ||
                'Data atlet tidak ditemukan.'
            );

        }


        athleteData =
            data.athlete;


        tampilkanData(
            athleteData
        );


        setStatus(
            '✅ Data atlet berhasil ditemukan.',
            'success'
        );


    } catch (error) {

        console.error(error);


        setStatus(
            '❌ Gagal mengambil data: ' +
            error.message,
            'error'
        );

    }

}


/* =========================================================
   TAMPILKAN DATA
========================================================= */

function tampilkanData(data) {


    /*
       Ambil ID
    */

    const id =
        data.idAtlet ||
        data.ID_Atlet ||
        data.id ||
        '';


    /*
       Ambil nama
    */

    const nama =
        data.nama ||
        data.namaAtlet ||
        data.Nama ||
        '';


    /*
       Kontingen
    */

    const kontingen =
        data.kontingen ||
        data.Kontingen ||
        '';


    /*
       Juara

       Bisa berupa:

       JUARA 1
       JUARA 2
       JUARA 3
       JUARA
    */

    let juara =
        data.juara ||
        data.statusJuara ||
        data.medali ||
        '';


    /*
       Kalau data berupa angka
    */

    if (
        juara !== '' &&
        !isNaN(juara)
    ) {

        juara =
            'JUARA ' +
            juara;

    }


    /*
       Jika status juara masih belum
       tetapi ada field medali,
       gunakan medali.

       Contoh:

       GOLD
       SILVER
       BRONZE
    */


    /*
       KATEGORI
    */

    const kategoriBerat =
        data.kategoriBerat ||
        data.kategori ||
        data.Kategori ||
        '';


    const kategoriUmur =
        data.kategoriUmur ||
        data.umurKategori ||
        data.ageCategory ||
        '';


    const jenisKelamin =
        data.jenisKelamin ||
        data.gender ||
        data.JenisKelamin ||
        '';


    /*
       Gabungkan:

       Kategori Berat
       [SPACE]
       Kategori Umur
       [SPACE]
       Jenis Kelamin

       Contoh:

       UNDER 24 PRACADET PUTRA
    */

    const kategoriGabungan =
        [
            kategoriBerat,
            kategoriUmur,
            jenisKelamin
        ]
        .filter(Boolean)
        .join(' ');


    /*
       NOMOR SERTIFIKAT

       Jika tersedia nomor sertifikat,
       gunakan itu.

       Kalau belum tersedia,
       gunakan ID Atlet.
    */

    const nomor =
        data.nomorSertifikat ||
        data.nomorRegistrasi ||
        id;


    /* =====================================================
       MASUKKAN KE PREVIEW
    ===================================================== */

    document.getElementById(
        'txtNomor'
    ).textContent = nomor;


    document.getElementById(
        'txtNama'
    ).textContent = nama;


    document.getElementById(
        'txtKontingen'
    ).textContent = kontingen;


    document.getElementById(
        'txtJuara'
    ).textContent = juara;


    document.getElementById(
        'txtKategori'
    ).textContent =
        kategoriGabungan;


    /* =====================================================
       DATA PANEL
    ===================================================== */

    document.getElementById(
        'viewId'
    ).textContent = id;


    document.getElementById(
        'viewNama'
    ).textContent = nama;


    document.getElementById(
        'viewKontingen'
    ).textContent = kontingen;


    document.getElementById(
        'viewJuara'
    ).textContent = juara;


    document.getElementById(
        'viewKategori'
    ).textContent =
        kategoriGabungan;


    document.getElementById(
        'dataBox'
    ).style.display = 'block';

}


/* =========================================================
   SCANNER
========================================================= */

function mulaiScan() {

    const container =
        document.getElementById(
            'scannerContainer'
        );


    container.style.display =
        'block';


    if (scannerRunning) {

        return;

    }


    html5QrCode =
        new Html5Qrcode(
            'reader'
        );


    const config = {

        fps: 10,

        qrbox: {
            width: 250,
            height: 250
        },

        aspectRatio: 1.0

    };


    html5QrCode
        .start(

            {
                facingMode: 'environment'
            },

            config,

            async (decodedText) => {

                console.log(
                    'QR TERBACA:',
                    decodedText
                );


                /*
                   STOP SCANNER
                */

                await stopScan();


                /*
                   QR bisa berupa:

                   CM-CC1EFFF7

                   ATAU

                   https://....

                   normalisasi akan
                   mengambil CM-...
                */

                const id =
                    normalisasiId(
                        decodedText
                    );


                document.getElementById(
                    'idAtlet'
                ).value = id;


                /*
                   Cari data
                */

                await cariAtlet(id);

            },

            (errorMessage) => {

                /*
                   Error scanning normal
                   tidak perlu ditampilkan.
                */

            }

        )
        .then(() => {

            scannerRunning = true;

            setStatus(
                '📷 Kamera aktif. Arahkan kamera ke QR Atlet.'
            );

        })
        .catch(error => {

            console.error(error);

            setStatus(
                '❌ Kamera tidak dapat dibuka: ' +
                error,
                'error'
            );

        });

}


/* =========================================================
   STOP SCANNER
========================================================= */

async function stopScan() {

    if (
        html5QrCode &&
        scannerRunning
    ) {

        try {

            await html5QrCode.stop();

        } catch (error) {

            console.warn(
                'Scanner stop:',
                error
            );

        }


        try {

            html5QrCode.clear();

        } catch (error) {}

    }


    scannerRunning = false;


    document.getElementById(
        'scannerContainer'
    ).style.display = 'none';

}


/* =========================================================
   PRINT
========================================================= */

function printPiagam() {

    if (!athleteData) {

        setStatus(
            '❌ Belum ada data atlet yang dipilih.',
            'error'
        );

        return;

    }


    /*
       Print langsung
    */

    window.print();

}


/* =========================================================
   ENTER = CARI
========================================================= */

document
    .getElementById('idAtlet')
    .addEventListener(
        'keydown',
        function(event) {

            if (
                event.key === 'Enter'
            ) {

                cariAtlet();

            }

        }
    );


/* =========================================================
   PRELOAD BACKGROUND
========================================================= */

const bg =
    new Image();

bg.src =
    BACKGROUND;


</script>

</body>
</html>
