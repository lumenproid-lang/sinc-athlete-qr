<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Cetak Piagam TGM95</title>


<style>

/* =====================================================
   GLOBAL
   ===================================================== */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 30px 15px;

    background: #eef1f7;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    color: #111827;
}

.container {
    width: 100%;
    max-width: 700px;
    margin: auto;
}

.card {
    background: #ffffff;

    border-radius: 18px;

    padding: 28px;

    box-shadow:
        0 8px 25px rgba(0,0,0,0.08);
}


/* =====================================================
   HEADER
   ===================================================== */

h1 {
    margin: 0 0 8px;

    text-align: center;

    font-size: 26px;
}

.subtitle {
    text-align: center;

    color: #6b7280;

    margin-bottom: 25px;

    line-height: 1.5;
}


/* =====================================================
   FORM
   ===================================================== */

label {
    display: block;

    font-weight: bold;

    margin-top: 16px;

    margin-bottom: 7px;
}

input {
    width: 100%;

    padding: 14px;

    border:
        1px solid #d1d5db;

    border-radius: 10px;

    font-size: 16px;

    outline: none;
}

input:focus {
    border-color: #2563eb;
}


/* =====================================================
   BUTTON
   ===================================================== */

button {
    width: 100%;

    padding: 14px;

    border: none;

    border-radius: 10px;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

    margin-top: 14px;
}

button:disabled {
    opacity: 0.5;

    cursor: not-allowed;
}

.btn-search {
    background: #111827;

    color: white;
}

.btn-scan {
    background: #2563eb;

    color: white;
}

.btn-print {
    background: #16a34a;

    color: white;
}

.btn-next {
    background: #7c3aed;

    color: white;
}

.btn-stop {
    background: #dc2626;

    color: white;
}


/* =====================================================
   STATUS
   ===================================================== */

.status {
    margin-top: 20px;

    padding: 14px;

    border-radius: 10px;

    display: none;

    line-height: 1.5;
}

.status.info {
    display: block;

    background: #e0f2fe;

    color: #075985;
}

.status.success {
    display: block;

    background: #dcfce7;

    color: #166534;
}

.status.error {
    display: block;

    background: #fee2e2;

    color: #991b1b;
}


/* =====================================================
   DATA CARD
   ===================================================== */

.data-card {

    display: none;

    margin-top: 22px;

    border:
        1px solid #e5e7eb;

    border-radius: 14px;

    padding: 20px;
}

.data-row {

    display: flex;

    justify-content: space-between;

    align-items: flex-start;

    gap: 20px;

    padding: 11px 0;

    border-bottom:
        1px solid #f0f0f0;
}

.data-row:last-child {
    border-bottom: none;
}

.data-label {

    font-weight: bold;

    color: #6b7280;
}

.data-value {

    text-align: right;

    font-weight: 600;

    max-width: 60%;
}


/* =====================================================
   SCANNER
   ===================================================== */

.scanner {

    display: none;

    margin-top: 15px;

    text-align: center;
}

#reader {

    width: 100%;

    max-width: 450px;

    margin: auto;
}


/* =====================================================
   NOTE
   ===================================================== */

.note {

    margin-top: 20px;

    font-size: 13px;

    color: #6b7280;

    text-align: center;

    line-height: 1.5;
}


/* =====================================================
   PRINT AREA
   ===================================================== */

.print-area {

    display: none;
}


/* =====================================================
   PRINT - A4 PORTRAIT
   ===================================================== */

@media print {

    @page {

        size: A4 portrait;

        margin: 0;
    }


    html,
    body {

        margin: 0 !important;

        padding: 0 !important;

        width: 210mm;

        height: 297mm;

        background: transparent !important;
    }


    /*
       SEMBUNYIKAN UI
    */

    body * {

        visibility: hidden !important;
    }


    /*
       TAMPILKAN HANYA DATA PRINT
    */

    .print-area,
    .print-area * {

        visibility: visible !important;
    }


    /*
       AREA A4
    */

    .print-area {

        display: block !important;

        position: absolute;

        left: 0;

        top: 0;

        width: 210mm;

        height: 297mm;

        background: transparent !important;
    }


    /*
       SEMUA TEKS CENTER
       TERHADAP A4

       Lebar A4 = 210mm
       Titik tengah = 105mm
    */

    .print-text {

        position: absolute;

        left: 105mm;

        transform:
            translateX(-50%);

        width: 180mm;

        margin: 0;

        padding: 0;

        text-align: center;

        font-family:
            Arial,
            Helvetica,
            sans-serif;

        color: #000000;

        line-height: 1.1;
    }


    /* =================================================
       1. NOMOR REGISTRASI
       ================================================= */

    .print-nomor {

        /*
           DARI HASIL FOTO:
           nomor berada di area bawah deretan logo
        */

        top: 66mm;

        font-size: 11pt;

        font-weight: normal;

        text-align: left;

        width: 180mm;

        left: 35mm;

        transform: none;

        white-space: nowrap;
    }


    /* =================================================
       2. NAMA ATLET
       ================================================= */

    .print-nama {

        /*
           NAMA berada di atas area
           SERTIFIKAT / PENGHARGAAN
        */

        top: 80mm;

        font-size: 20pt;

        font-weight: bold;

        width: 180mm;

        white-space: nowrap;
    }


    /* =================================================
       3. KONTINGEN
       ================================================= */

    .print-kontingen {

        /*
           Kontingen tepat di bawah nama
        */

        top: 94mm;

        font-size: 13pt;

        font-weight: normal;

        width: 180mm;

        white-space: nowrap;
    }


    /* =================================================
       4. JUARA
       ================================================= */

    .print-juara {

        /*
           Posisi pada area JUARA
        */

        top: 149mm;

        font-size: 18pt;

        font-weight: bold;

        width: 180mm;

        white-space: nowrap;
    }


    /* =================================================
       5. KATEGORI
       ================================================= */

    .print-kategori {

        /*
           FORMAT:

           KATEGORI BERAT
           [spasi]
           KATEGORI UMUR
           [spasi]
           JENIS KELAMIN
        */

        top: 163mm;

        font-size: 12pt;

        font-weight: normal;

        width: 180mm;

        white-space: nowrap;
    }


    /*
       Gender tidak dicetak terpisah.
       Sudah digabung ke kategori.
    */

    .print-gender {

        display: none !important;
    }

}


/* =====================================================
   MOBILE
   ===================================================== */

@media screen and (max-width: 600px) {

    body {
        padding: 15px 10px;
    }

    .card {
        padding: 20px;
    }

    .data-row {
        flex-direction: column;

        gap: 4px;
    }

    .data-value {
        max-width: 100%;

        text-align: left;
    }

}

</style>


<!-- =====================================================
     QR SCANNER LIBRARY
     ===================================================== -->

<script src="https://unpkg.com/html5-qrcode"></script>

</head>


<body>


<!-- =====================================================
     UI UTAMA
     ===================================================== -->

<div class="container">

    <div class="card">


        <h1>
            📜 CETAK PIAGAM
        </h1>


        <div class="subtitle">

            Taekwondo Garuda Muda 95

            <br>

            Walikota Tomohon Cup Series II 2026

        </div>


        <!-- =============================================
             PETUGAS
             ============================================= -->

        <label>
            Nama Petugas
        </label>

        <input
            type="text"
            id="petugas"
            value="Riyan"
            placeholder="Nama petugas"
        >


        <!-- =============================================
             ID ATLET
             ============================================= -->

        <label>
            Nomor Registrasi / ID Atlet
        </label>

        <input
            type="text"
            id="athleteId"
            placeholder="Contoh: CM-301C3D57"
            autocomplete="off"
        >


        <button
            class="btn-search"
            onclick="lookupAthlete()"
        >
            🔎 CARI ATLET
        </button>


        <!-- =============================================
             SCAN QR
             ============================================= -->

        <button
            class="btn-scan"
            onclick="startScanner()"
        >
            📷 SCAN QR
        </button>


        <!-- =============================================
             SCANNER
             ============================================= -->

        <div
            id="scanner"
            class="scanner"
        >

            <div id="reader"></div>


            <button
                class="btn-stop"
                onclick="stopScanner()"
            >
                ✖ TUTUP SCANNER
            </button>

        </div>


        <!-- =============================================
             STATUS
             ============================================= -->

        <div
            id="status"
            class="status"
        ></div>


        <!-- =============================================
             DATA ATLET
             ============================================= -->

        <div
            id="dataCard"
            class="data-card"
        >


            <div class="data-row">

                <div class="data-label">
                    Nomor Registrasi
                </div>

                <div
                    class="data-value"
                    id="dId"
                >
                    -
                </div>

            </div>


            <div class="data-row">

                <div class="data-label">
                    Nama
                </div>

                <div
                    class="data-value"
                    id="dNama"
                >
                    -
                </div>

            </div>


            <div class="data-row">

                <div class="data-label">
                    Kontingen
                </div>

                <div
                    class="data-value"
                    id="dKontingen"
                >
                    -
                </div>

            </div>


            <div class="data-row">

                <div class="data-label">
                    Juara
                </div>

                <div
                    class="data-value"
                    id="dJuara"
                >
                    -
                </div>

            </div>


            <div class="data-row">

                <div class="data-label">
                    Kategori Berat
                </div>

                <div
                    class="data-value"
                    id="dKategori"
                >
                    -
                </div>

            </div>


            <div class="data-row">

                <div class="data-label">
                    Kategori Umur
                </div>

                <div
                    class="data-value"
                    id="dUmur"
                >
                    -
                </div>

            </div>


            <div class="data-row">

                <div class="data-label">
                    Jenis Kelamin
                </div>

                <div
                    class="data-value"
                    id="dGender"
                >
                    -
                </div>

            </div>


            <button
                class="btn-print"
                onclick="printPiagam()"
            >
                🖨️ PRINT PIAGAM
            </button>


            <button
                class="btn-next"
                onclick="nextAthlete()"
            >
                ➡️ ATLET BERIKUTNYA
            </button>


        </div>


        <div class="note">

            Template piagam tetap menggunakan
            background/kertas asli.

            <br>

            Website hanya mencetak data atlet
            pada posisi yang sudah ditentukan.

        </div>


    </div>

</div>



<!-- =====================================================
     AREA PRINT
     ===================================================== -->

<div class="print-area">


    <!-- =============================================
         NOMOR REGISTRASI
         ============================================= -->

    <div
        id="pNomor"
        class="print-text print-nomor"
    ></div>


    <!-- =============================================
         NAMA ATLET
         ============================================= -->

    <div
        id="pNama"
        class="print-text print-nama"
    ></div>


    <!-- =============================================
         KONTINGEN
         ============================================= -->

    <div
        id="pKontingen"
        class="print-text print-kontingen"
    ></div>


    <!-- =============================================
         JUARA
         ============================================= -->

    <div
        id="pJuara"
        class="print-text print-juara"
    ></div>


    <!-- =============================================
         KATEGORI + UMUR + GENDER
         ============================================= -->

    <div
        id="pKategori"
        class="print-text print-kategori"
    ></div>


    <!-- Gender terpisah tidak digunakan -->

    <div
        id="pGender"
        class="print-text print-gender"
    ></div>


</div>



<script>

/* =====================================================
   API
   ===================================================== */

const API =
'https://script.google.com/macros/s/AKfycbz2Gqo1Yhud50ODwXcoQokzEi3cF484EiTSz9FPp9JhtSiHBRZybTYKvsQsavDqAUGtwQ/exec';


/* =====================================================
   GLOBAL
   ===================================================== */

let currentAthlete = null;

let html5QrCode = null;


/* =====================================================
   STATUS
   ===================================================== */

function showStatus(message, type) {

    const status =
        document.getElementById('status');

    status.className =
        'status ' + type;

    status.textContent =
        message;

}


/* =====================================================
   LOOKUP BERDASARKAN ID ATLET
   ===================================================== */

async function lookupAthlete() {

    const id =
        document
            .getElementById('athleteId')
            .value
            .trim();


    if (!id) {

        showStatus(
            'Masukkan Nomor Registrasi / ID Atlet.',
            'error'
        );

        return;
    }


    showStatus(
        '⏳ Mengambil data atlet...',
        'info'
    );


    document
        .getElementById('dataCard')
        .style.display =
            'none';


    try {

        const url =
            API +
            '?action=lookup&id=' +
            encodeURIComponent(id);


        const response =
            await fetch(
                url,
                {
                    method: 'GET',
                    cache: 'no-store'
                }
            );


        if (!response.ok) {

            throw new Error(
                'HTTP ' + response.status
            );

        }


        const data =
            await response.json();


        console.log(
            'API RESPONSE:',
            data
        );


        if (!data.success) {

            throw new Error(
                data.error ||
                'Data atlet tidak ditemukan.'
            );

        }


        if (!data.athlete) {

            throw new Error(
                'Data atlet kosong.'
            );

        }


        currentAthlete =
            data.athlete;


        displayAthlete(
            currentAthlete
        );


        showStatus(
            '✅ Data atlet ditemukan.',
            'success'
        );


    } catch (error) {

        console.error(
            'LOOKUP ERROR:',
            error
        );


        showStatus(
            '❌ Gagal mengambil data: ' +
            error.message,
            'error'
        );

    }

}


/* =====================================================
   DISPLAY DATA ATLET
   ===================================================== */

function displayAthlete(a) {


    /*
       NOMOR REGISTRASI
    */

    const id =
        a.idAtlet ||
        a.nomorRegistrasi ||
        a.id ||
        '';


    /*
       NAMA
    */

    const nama =
        a.nama ||
        '';


    /*
       KONTINGEN
    */

    const kontingen =
        a.kontingen ||
        '';


    /*
       JUARA
    */

    const juara =
        a.statusJuara ||
        a.juara ||
        a.medali ||
        '';


    /*
       KATEGORI BERAT
    */

    const kategori =
        a.kategoriBerat ||
        a.kategori ||
        '';


    /*
       KATEGORI UMUR

       Diambil dari:
       kategoriUmur
       atau umur
       atau kategoriUsia

       Code.gs harus mengirimkan
       kategori umur dari kolom U.
    */

    const umur =
        a.kategoriUmur ||
        a.umur ||
        a.kategoriUsia ||
        '';


    /*
       JENIS KELAMIN
    */

    const gender =
        a.jenisKelamin ||
        a.gender ||
        '';


    /* =================================================
       TAMPILKAN KE LAYAR
       ================================================= */

    document
        .getElementById('dId')
        .textContent =
            id || '-';


    document
        .getElementById('dNama')
        .textContent =
            nama || '-';


    document
        .getElementById('dKontingen')
        .textContent =
            kontingen || '-';


    document
        .getElementById('dJuara')
        .textContent =
            juara || '-';


    document
        .getElementById('dKategori')
        .textContent =
            kategori || '-';


    document
        .getElementById('dUmur')
        .textContent =
            umur || '-';


    document
        .getElementById('dGender')
        .textContent =
            gender || '-';


    document
        .getElementById('dataCard')
        .style.display =
            'block';


    /* =================================================
       DATA UNTUK PRINT
       ================================================= */


    /*
       NOMOR
    */

    document
        .getElementById('pNomor')
        .textContent =
            a.nomorSertifikat ||
            a.nomorRegistrasi ||
            id;


    /*
       NAMA
    */

    document
        .getElementById('pNama')
        .textContent =
            nama;


    /*
       KONTINGEN
    */

    document
        .getElementById('pKontingen')
        .textContent =
            kontingen;


    /*
       JUARA
    */

    document
        .getElementById('pJuara')
        .textContent =
            juara;


    /*
       KATEGORI:

       BERAT + SPACE +
       UMUR + SPACE +
       GENDER
    */

    const kategoriPrint =
        [
            kategori,
            umur,
            gender
        ]
        .filter(
            value =>
                value !== null &&
                value !== undefined &&
                String(value).trim() !== ''
        )
        .join(' ');


    document
        .getElementById('pKategori')
        .textContent =
            kategoriPrint;


    /*
       Gender tidak dicetak
       sebagai field terpisah.
    */

    document
        .getElementById('pGender')
        .textContent =
            '';

}


/* =====================================================
   PRINT PIAGAM
   ===================================================== */

function printPiagam() {


    if (!currentAthlete) {

        showStatus(
            'Belum ada data atlet.',
            'error'
        );

        return;
    }


    /*
       Print langsung.
    */

    window.print();

}


/* =====================================================
   ATLET BERIKUTNYA
   ===================================================== */

function nextAthlete() {


    currentAthlete =
        null;


    document
        .getElementById('athleteId')
        .value =
            '';


    document
        .getElementById('dataCard')
        .style.display =
            'none';


    document
        .getElementById('status')
        .className =
            'status';


    document
        .getElementById('status')
        .textContent =
            '';


    document
        .getElementById('athleteId')
        .focus();

}


/* =====================================================
   START QR SCANNER
   ===================================================== */

function startScanner() {


    document
        .getElementById('scanner')
        .style.display =
            'block';


    showStatus(
        '📷 Arahkan kamera ke QR Code ID Card.',
        'info'
    );


    if (!html5QrCode) {

        html5QrCode =
            new Html5Qrcode(
                'reader'
            );

    }


    html5QrCode.start(

        {
            facingMode:
                'environment'
        },

        {
            fps: 10,

            qrbox: {
                width: 250,
                height: 250
            }
        },


        /*
           QR BERHASIL TERBACA
        */

        async function(decodedText) {


            console.log(
                'QR TERBACA:',
                decodedText
            );


            await stopScanner();


            showStatus(
                '⏳ QR terbaca. Mencari data atlet...',
                'info'
            );


            try {


                /*
                   QR ID CARD berisi QR URL.

                   Kirim nilai QR tersebut
                   ke Apps Script.
                */

                const url =
                    API +
                    '?action=lookup&qr=' +
                    encodeURIComponent(
                        decodedText
                    );


                const response =
                    await fetch(
                        url,
                        {
                            method: 'GET',
                            cache: 'no-store'
                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        'HTTP ' +
                        response.status
                    );

                }


                const data =
                    await response.json();


                console.log(
                    'QR API RESPONSE:',
                    data
                );


                if (
                    !data.success ||
                    !data.athlete
                ) {

                    throw new Error(
                        data.error ||
                        'QR tidak ditemukan di database.'
                    );

                }


                currentAthlete =
                    data.athlete;


                displayAthlete(
                    currentAthlete
                );


                showStatus(
                    '✅ QR berhasil. Data atlet ditemukan.',
                    'success'
                );


            } catch (error) {

                console.error(
                    'QR LOOKUP ERROR:',
                    error
                );


                showStatus(
                    '❌ QR terbaca, tetapi data tidak ditemukan: ' +
                    error.message,
                    'error'
                );

            }

        },


        /*
           Error pembacaan frame
           sengaja tidak ditampilkan.
        */

        function(errorMessage) {

        }

    ).catch(

        function(error) {

            console.error(
                'CAMERA ERROR:',
                error
            );


            showStatus(
                '❌ Kamera tidak dapat digunakan: ' +
                error,
                'error'
            );

        }

    );

}


/* =====================================================
   STOP QR SCANNER
   ===================================================== */

async function stopScanner() {


    if (html5QrCode) {

        try {

            await html5QrCode.stop();

            html5QrCode.clear();

        } catch (error) {

            console.log(
                'STOP SCANNER:',
                error
            );

        }


        html5QrCode =
            null;

    }


    document
        .getElementById('scanner')
        .style.display =
            'none';

}


/* =====================================================
   ENTER = CARI
   ===================================================== */

document
    .getElementById('athleteId')
    .addEventListener(
        'keydown',
        function(event) {

            if (
                event.key === 'Enter'
            ) {

                lookupAthlete();

            }

        }
    );

</script>


</body>

</html>
