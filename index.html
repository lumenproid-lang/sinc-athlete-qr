<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SINC Athlete QR - Petugas</title><script src="https://unpkg.com/html5-qrcode"></script><style>body{font-family:Arial;margin:0;background:#f3f4f6;color:#111827}.wrap{max-width:560px;margin:auto;padding:16px}.card{background:#fff;padding:20px;border-radius:20px;margin-bottom:16px;box-shadow:0 4px 15px #0001}input,select,button{width:100%;padding:14px;margin-top:8px;border-radius:12px;font-size:16px;box-sizing:border-box}input,select{border:1px solid #ddd}button{border:0;font-weight:bold}.p{background:#111827;color:white}.g{background:#16a34a;color:white}.r{background:#dc2626;color:white}.o{background:#d97706;color:white}.b{background:#2563eb;color:white}.v{background:#7c3aed;color:white}.m{background:#e5e7eb}.hide{display:none}.status{padding:14px;border-radius:12px;margin-top:10px;font-weight:bold}.ok{background:#dcfce7;color:#166534}.no{background:#fee2e2;color:#991b1b}.warn{background:#fef3c7;color:#92400e}.msg{padding:12px;border-radius:12px;margin-bottom:12px;font-weight:bold}.name{font-size:26px;font-weight:bold}</style></head><body><div class="wrap"><div class="card"><h1>🏆 SINC Athlete QR</h1><p>Panel Petugas</p><input id="petugas" placeholder="Nama petugas"><button class="p" onclick="start()">📷 MULAI SCAN QR</button><button id="stop" class="m hide" onclick="stop()">✖ TUTUP SCANNER</button><div id="reader"></div></div><div id="card" class="card hide"><div id="msg" class="msg"></div><div id="nama" class="name"></div><p>ID: <span id="id"></span></p><p>Kontingen: <span id="kontingen"></span></p><p>Kategori: <span id="kategori"></span></p><p>Gender: <span id="gender"></span></p><h3>🏆 Verifikasi Juara</h3><select id="juara"><option value="">Pilih...</option><option>JUARA 1</option><option>JUARA 2</option><option>JUARA 3</option><option>JUARA 3 BERSAMA</option><option>FINALIS</option><option>TIDAK JUARA</option></select><button class="v" onclick="saveJuara()">🏆 SIMPAN STATUS JUARA</button><h3>⚖️ Verifikasi Timbang</h3><input id="berat" inputmode="decimal" placeholder="Hasil timbang (kg), opsional"><button class="g" onclick="saveTimbang('LOLOS VERIFIKASI TIMBANG')">🟢 LOLOS VERIFIKASI TIMBANG</button><button class="r" onclick="saveTimbang('TIDAK LOLOS VERIFIKASI TIMBANG')">🔴 TIDAK LOLOS VERIFIKASI TIMBANG</button><div id="timbang" class="status warn">⚖️ BELUM DIVERIFIKASI</div><h3>🥇📜 Award</h3><div id="medali" class="status no">🥇 MEDALI: BELUM DIAMBIL</div><button id="bm" class="o" onclick="award('medali')">🥇 SERAHKAN MEDALI</button><div id="piagam" class="status no">📜 PIAGAM: BELUM DIAMBIL</div><button id="bp" class="b" onclick="award('piagam')">📜 SERAHKAN PIAGAM</button><button class="m" onclick="resetA()">🔄 SCAN ATLET BERIKUTNYA</button></div></div><script>const API='https://script.google.com/macros/s/AKfycbz2Gqo1Yhud50ODwXcoQokzEi3cF484EiTSz9FPp9JhtSiHBRZybTYKvsQsavDqAUGtwQ/exec',TOKEN='SINC-TOMOHON-2026';let s=null,a=null;function petugas(){let x=document.getElementById('petugas').value.trim();if(!x)alert('Masukkan nama petugas.');return x}function start(){if(!petugas())return;s=new Html5Qrcode('reader');document.getElementById('stop').classList.remove('hide');s.start({facingMode:'environment'},{fps:10,qrbox:250},t=>{stop();lookup(t)},()=>{}).catch(e=>alert('Kamera gagal dibuka: '+e))}function stop(){if(s){let x=s;s=null;x.stop().then(()=>x.clear()).catch(()=>{});}document.getElementById('stop').classList.add('hide')}function api(action,p,cb){let n='cb'+Date.now(),sc=document.createElement('script');window[n]=d=>{cb(d);delete window[n];sc.remove()};let q=new URLSearchParams({action,callback:n,...p});sc.src=API+'?'+q;sc.onerror=()=>{cb({success:false,error:'Server tidak dapat dihubungi'});delete window[n];sc.remove()};document.body.appendChild(sc)}function lookup(qr){api('lookup',{qr},d=>{if(!d.success)return alert(d.error);a=d.athlete;render();document.getElementById('card').classList.remove('hide');})}function render(){for(let [id,k] of [['nama','nama'],['id','idAtlet'],['kontingen','kontingen'],['kategori','kategori'],['gender','jenisKelamin']])document.getElementById(id).textContent=a[k]||'-';document.getElementById('juara').value=['JUARA 1','JUARA 2','JUARA 3','JUARA 3 BERSAMA','FINALIS','TIDAK JUARA'].includes(String(a.statusJuara).toUpperCase())?String(a.statusJuara).toUpperCase():'';document.getElementById('berat').value=a.hasilTimbang||'';document.getElementById('timbang').textContent='⚖️ '+(a.statusTimbang||'BELUM DIVERIFIKASI');document.getElementById('timbang').className='status '+(String(a.statusTimbang||'').includes('TIDAK')?'no':String(a.statusTimbang||'').includes('LOLOS')?'ok':'warn');document.getElementById('medali').textContent='🥇 MEDALI: '+(String(a.medali).toUpperCase()==='SUDAH'?'SUDAH DIAMBIL':'BELUM DIAMBIL');document.getElementById('piagam').textContent='📜 PIAGAM: '+(String(a.piagam).toUpperCase()==='SUDAH'?'SUDAH DIAMBIL':'BELUM DIAMBIL');document.getElementById('bm').disabled=String(a.medali).toUpperCase()==='SUDAH';document.getElementById('bp').disabled=String(a.piagam).toUpperCase()==='SUDAH'}function saveJuara(){let p=petugas(),j=document.getElementById('juara').value;if(!p||!j)return alert('Pilih status juara.');if(!confirm('Simpan '+j+' untuk '+a.nama+'?'))return;api('juara',{qr:a.qrUrl,juara:j,petugas:p,token:TOKEN},d=>{if(!d.success)return alert(d.error);a.statusJuara=j;render();alert('Status juara tersimpan.')})}function saveTimbang(st){let p=petugas();if(!p)return;if(!confirm('Simpan hasil: '+st+'?'))return;api('timbang',{qr:a.qrUrl,berat:document.getElementById('berat').value.trim(),statusTimbang:st,petugas:p,token:TOKEN},d=>{if(!d.success)return alert(d.error);a.hasilTimbang=d.berat;a.statusTimbang=st;render();alert('Verifikasi timbang tersimpan.')})}function award(type){let p=petugas();if(!p)return;let st=type==='medali'?a.medali:a.piagam;if(String(st).toUpperCase()==='SUDAH')return alert('Sudah diambil.');if(!confirm('Konfirmasi pengambilan?'))return;api(type,{qr:a.qrUrl,petugas:p,token:TOKEN},d=>{if(!d.success)return alert(d.error);a[type]='SUDAH';render();alert('Berhasil dicatat.')})}function resetA(){a=null;document.getElementById('card').classList.add('hide');window.scrollTo(0,0)}</script></body></html>
