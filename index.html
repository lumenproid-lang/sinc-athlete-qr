<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#071426">

<title>SINC Athlete QR - Petugas</title>

<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#071426,#101d3a,#162d55);
  min-height:100vh;
  color:#111827;
}

.wrap{
  width:100%;
  max-width:560px;
  margin:auto;
  padding:18px;
}

.card{
  background:#fff;
  padding:20px;
  border-radius:20px;
  margin-bottom:18px;
  box-shadow:0 8px 25px rgba(0,0,0,.2);
}

h1{
  margin:0;
  font-size:25px;
}

.subtitle{
  margin:7px 0 18px;
  color:#6b7280;
}

input,
select,
button{
  width:100%;
  padding:14px;
  margin-top:9px;
  border-radius:12px;
  font-size:16px;
  box-sizing:border-box;
}

input,
select{
  border:1px solid #d1d5db;
  background:#fff;
}

button{
  border:0;
  font-weight:800;
  cursor:pointer;
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.p{
  background:#111827;
  color:#fff;
}

.g{
  background:#16a34a;
  color:#fff;
}

.r{
  background:#dc2626;
  color:#fff;
}

.o{
  background:#d97706;
  color:#fff;
}

.b{
  background:#2563eb;
  color:#fff;
}

.v{
  background:#7c3aed;
  color:#fff;
}

.m{
  background:#e5e7eb;
  color:#111827;
}

.hide{
  display:none!important;
}

#reader{
  width:100%;
  margin-top:12px;
  overflow:hidden;
  border-radius:14px;
}

.status{
  padding:14px;
  border-radius:12px;
  margin-top:10px;
  font-weight:bold;
}

.ok{
  background:#dcfce7;
  color:#166534;
}

.no{
  background:#fee2e2;
  color:#991b1b;
}

.warn{
  background:#fef3c7;
  color:#92400e;
}

.info{
  margin:9px 0;
  line-height:1.5;
}

.info strong{
  display:inline-block;
  min-width:105px;
}

.name{
  font-size:27px;
  font-weight:800;
  line-height:1.15;
  margin-bottom:16px;
}

.section-title{
  font-size:18px;
  font-weight:800;
  margin-top:22px;
  margin-bottom:8px;
}

.msg{
  padding:13px;
  border-radius:12px;
  margin-bottom:14px;
  font-weight:bold;
  background:#dbeafe;
  color:#1e40af;
}

.loading{
  padding:13px;
  border-radius:12px;
  margin-top:12px;
  background:#dbeafe;
  color:#1e40af;
  font-weight:bold;
  display:none;
}

.error{
  padding:13px;
  border-radius:12px;
  margin-top:12px;
  background:#fee2e2;
  color:#991b1b;
  font-weight:bold;
  display:none;
}

.footer{
  text-align:center;
  color:#fff;
  opacity:.65;
  font-size:12px;
  padding:5px 0 20px;
}
</style>
</head>

<body>

<div class="wrap">

  <!-- PANEL PETUGAS -->
  <div class="card">

    <h1>🏆 SINC Athlete QR</h1>

    <div class="subtitle">
      Panel Petugas
    </div>

    <input
      id="petugas"
      placeholder="Nama petugas"
      autocomplete="off"
    >

    <button
      id="startButton"
      class="p"
      onclick="startScanner()"
    >
      📷 MULAI SCAN QR
    </button>

    <button
      id="stopButton"
      class="m hide"
      onclick="stopScanner()"
    >
      ✖ TUTUP SCANNER
    </button>

    <div id="reader"></div>

  </div>


  <!-- HASIL ATLET -->
  <div
    id="card"
    class="card hide"
  >

    <div id="msg" class="msg hide"></div>

    <div
      id="loading"
      class="loading"
    >
      ⏳ Mengambil data atlet...
    </div>

    <div
      id="error"
      class="error"
    ></div>


    <div
      id="nama"
      class="name"
    ></div>

    <div class="info">
      <strong>ID Atlet:</strong>
      <span id="id"></span>
    </div>

    <div class="info">
      <strong>Kontingen:</strong>
      <span id="kontingen"></span>
    </div>

    <div class="info">
      <strong>Kategori:</strong>
      <span id="kategori"></span>
    </div>

    <div class="info">
      <strong>Gender:</strong>
      <span id="gender"></span>
    </div>


    <!-- JUARA -->
    <div class="section-title">
      🏆 Verifikasi Juara
    </div>

    <select id="juara">

      <option value="">
        Pilih...
      </option>

      <option value="JUARA 1">
        JUARA 1
      </option>

      <option value="JUARA 2">
        JUARA 2
      </option>

      <option value="JUARA 3">
        JUARA 3
      </option>

      <option value="JUARA 3 BERSAMA">
        JUARA 3 BERSAMA
      </option>

      <option value="FINALIS">
        FINALIS
      </option>

      <option value="TIDAK JUARA">
        TIDAK JUARA
      </option>

    </select>

    <button
      class="v"
      onclick="saveJuara()"
    >
      🏆 SIMPAN STATUS JUARA
    </button>


    <!-- TIMBANG -->
    <div class="section-title">
      ⚖️ Verifikasi Timbang
    </div>

    <input
      id="berat"
      inputmode="decimal"
      placeholder="Hasil timbang (kg), opsional"
    >

    <button
      class="g"
      onclick="saveTimbang('LOLOS VERIFIKASI TIMBANG')"
    >
      🟢 LOLOS VERIFIKASI TIMBANG
    </button>

    <button
      class="r"
      onclick="saveTimbang('TIDAK LOLOS VERIFIKASI TIMBANG')"
    >
      🔴 TIDAK LOLOS VERIFIKASI TIMBANG
    </button>

    <div
      id="timbang"
      class="status warn"
    >
      ⚖️ BELUM DIVERIFIKASI
    </div>


    <!-- AWARD -->
    <div class="section-title">
      🥇📜 Award
    </div>


    <div
      id="medali"
      class="status no"
    >
      🥇 MEDALI: BELUM DIAMBIL
    </div>

    <button
      id="bm"
      class="o"
      onclick="award('medali')"
    >
      🥇 SERAHKAN MEDALI
    </button>


    <div
      id="piagam"
      class="status no"
    >
      📜 PIAGAM: BELUM DIAMBIL
    </div>

    <button
      id="bp"
      class="b"
      onclick="award('piagam')"
    >
      📜 SERAHKAN PIAGAM
    </button>


    <button
      class="m"
      onclick="resetAthlete()"
    >
      🔄 SCAN ATLET BERIKUTNYA
    </button>

  </div>


  <div class="footer">
    arenajawara.id | Lumen Pro Bersinergi
  </div>

</div>


<script>

/* =====================================================
   KONFIGURASI
===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbz2Gqo1Yhud50ODwXcoQokzEi3cF484EiTSz9FPp9JhtSiHBRZybTYKvsQsavDqAUGtwQ/exec";

const API_TOKEN =
"SINC-TOMOHON-2026";


let scanner = null;
let athlete = null;
let requestTimeout = null;


/* =====================================================
   PETUGAS
===================================================== */

function getPetugas(){

  const value =
    document.getElementById("petugas")
      .value
      .trim();

  if(!value){

    alert("Masukkan nama petugas terlebih dahulu.");

    return null;
  }

  return value;
}


/* =====================================================
   SCANNER
===================================================== */

function startScanner(){

  if(!getPetugas()){
    return;
  }

  if(scanner){
    return;
  }

  clearError();

  scanner =
    new Html5Qrcode("reader");

  scanner.start(

    {
      facingMode:"environment"
    },

    {
      fps:10,
      qrbox:{
        width:250,
        height:250
      }
    },

    function(decodedText){

      stopScanner();

      lookupAthlete(decodedText);

    },

    function(errorMessage){

      // error scan diabaikan
    }

  ).then(function(){

    document
      .getElementById("startButton")
      .classList.add("hide");

    document
      .getElementById("stopButton")
      .classList.remove("hide");

  }).catch(function(error){

    scanner = null;

    alert(
      "Kamera gagal dibuka.\n\n" +
      "Pastikan browser memiliki izin kamera."
    );

  });

}


/* =====================================================
   STOP SCANNER
===================================================== */

function stopScanner(){

  if(!scanner){

    document
      .getElementById("startButton")
      .classList.remove("hide");

    document
      .getElementById("stopButton")
      .classList.add("hide");

    return;
  }

  const currentScanner = scanner;

  scanner = null;

  currentScanner
    .stop()
    .then(function(){

      try{
        currentScanner.clear();
      }catch(e){}

    })
    .catch(function(){})

    .finally(function(){

      document
        .getElementById("startButton")
        .classList.remove("hide");

      document
        .getElementById("stopButton")
        .classList.add("hide");

    });

}


/* =====================================================
   JSONP API
===================================================== */

function api(action, params, callback){

  const callbackName =
    "sinc_callback_" +
    Date.now() +
    "_" +
    Math.floor(Math.random()*100000);


  const script =
    document.createElement("script");


  let finished = false;


  function cleanup(){

    if(requestTimeout){
      clearTimeout(requestTimeout);
      requestTimeout = null;
    }

    try{
      delete window[callbackName];
    }catch(e){
      window[callbackName] = undefined;
    }

    try{
      script.remove();
    }catch(e){}

  }


  window[callbackName] =
    function(data){

      if(finished){
        return;
      }

      finished = true;

      cleanup();

      callback(data);

    };


  const query =
    new URLSearchParams();


  query.set("action", action);
  query.set("callback", callbackName);


  Object.keys(params || {})
    .forEach(function(key){

      const value =
        params[key];

      if(
        value !== undefined &&
        value !== null
      ){

        query.set(
          key,
          value
        );

      }

    });


  script.src =
    API_URL +
    "?" +
    query.toString();


  script.async = true;


  script.onerror =
    function(){

      if(finished){
        return;
      }

      finished = true;

      cleanup();

      callback({
        success:false,
        error:
          "Request API gagal dimuat oleh browser."
      });

    };


  requestTimeout =
    setTimeout(function(){

      if(finished){
        return;
      }

      finished = true;

      cleanup();

      callback({
        success:false,
        error:
          "Server tidak merespons. Coba lagi."
      });

    },15000);


  document
    .body
    .appendChild(script);

}


/* =====================================================
   LOOKUP ATLET
===================================================== */

function lookupAthlete(qr){

  showLoading();

  document
    .getElementById("card")
    .classList
    .remove("hide");


  api(
    "lookup",
    {
      qr:qr
    },

    function(data){

      hideLoading();


      if(
        !data ||
        !data.success
      ){

        showError(
          data && data.error
            ? data.error
            : "Data atlet tidak ditemukan."
        );

        return;
      }


      athlete =
        data.athlete;


      renderAthlete();

    }

  );

}


/* =====================================================
   RENDER DATA
===================================================== */

function renderAthlete(){

  if(!athlete){
    return;
  }


  document
    .getElementById("nama")
    .textContent =
      athlete.nama || "-";


  document
    .getElementById("id")
    .textContent =
      athlete.idAtlet || "-";


  document
    .getElementById("kontingen")
    .textContent =
      athlete.kontingen || "-";


  document
    .getElementById("kategori")
    .textContent =
      athlete.kategori || "-";


  document
    .getElementById("gender")
    .textContent =
      athlete.jenisKelamin || "-";


  /* JUARA */

  const allowedJuara = [
    "JUARA 1",
    "JUARA 2",
    "JUARA 3",
    "JUARA 3 BERSAMA",
    "FINALIS",
    "TIDAK JUARA"
  ];


  const currentJuara =
    String(
      athlete.statusJuara || ""
    )
    .trim()
    .toUpperCase();


  document
    .getElementById("juara")
    .value =
      allowedJuara.includes(currentJuara)
        ? currentJuara
        : "";


  /* TIMBANG */

  document
    .getElementById("berat")
    .value =
      athlete.hasilTimbang || "";


  const timbangStatus =
    String(
      athlete.statusTimbang ||
      "BELUM DIVERIFIKASI"
    );


  const timbangElement =
    document.getElementById("timbang");


  timbangElement.textContent =
    "⚖️ " +
    timbangStatus;


  timbangElement.className =
    "status " +
    (
      timbangStatus
        .toUpperCase()
        .includes("TIDAK")
        ? "no"
        :
      timbangStatus
        .toUpperCase()
        .includes("LOLOS")
        ? "ok"
        : "warn"
    );


  /* MEDALI */

  const medaliSudah =
    String(
      athlete.medali || ""
    )
    .toUpperCase() === "SUDAH";


  document
    .getElementById("medali")
    .textContent =
      medaliSudah
        ? "🥇 MEDALI: SUDAH DIAMBIL"
        : "🥇 MEDALI: BELUM DIAMBIL";


  document
    .getElementById("medali")
    .className =
      "status " +
      (
        medaliSudah
          ? "ok"
          : "no"
      );


  document
    .getElementById("bm")
    .disabled =
      medaliSudah;


  /* PIAGAM */

  const piagamSudah =
    String(
      athlete.piagam || ""
    )
    .toUpperCase() === "SUDAH";


  document
    .getElementById("piagam")
    .textContent =
      piagamSudah
        ? "📜 PIAGAM: SUDAH DIAMBIL"
        : "📜 PIAGAM: BELUM DIAMBIL";


  document
    .getElementById("piagam")
    .className =
      "status " +
      (
        piagamSudah
          ? "ok"
          : "no"
      );


  document
    .getElementById("bp")
    .disabled =
      piagamSudah;


  clearError();

}


/* =====================================================
   SIMPAN JUARA
===================================================== */

function saveJuara(){

  const petugas =
    getPetugas();

  if(!petugas){
    return;
  }


  if(!athlete){
    return;
  }


  const juara =
    document
      .getElementById("juara")
      .value;


  if(!juara){

    alert(
      "Pilih status juara terlebih dahulu."
    );

    return;
  }


  if(
    !confirm(
      "Simpan " +
      juara +
      " untuk " +
      athlete.nama +
      "?"
    )
  ){

    return;
  }


  showLoading();


  api(

    "juara",

    {
      qr:
        athlete.qrUrl,

      juara:
        juara,

      petugas:
        petugas,

      token:
        API_TOKEN
    },

    function(data){

      hideLoading();


      if(
        !data ||
        !data.success
      ){

        showError(
          data && data.error
            ? data.error
            : "Gagal menyimpan status juara."
        );

        return;
      }


      athlete.statusJuara =
        juara;


      renderAthlete();


      alert(
        "Status juara berhasil disimpan."
      );

    }

  );

}


/* =====================================================
   SIMPAN TIMBANG
===================================================== */

function saveTimbang(status){

  const petugas =
    getPetugas();

  if(!petugas){
    return;
  }


  if(!athlete){
    return;
  }


  const berat =
    document
      .getElementById("berat")
      .value
      .trim();


  if(
    !confirm(
      "Simpan hasil:\n\n" +
      status +
      "\n" +
      (berat
        ? berat + " kg"
        : "Berat tidak diisi")
    )
  ){

    return;
  }


  showLoading();


  api(

    "timbang",

    {
      qr:
        athlete.qrUrl,

      berat:
        berat,

      statusTimbang:
        status,

      petugas:
        petugas,

      token:
        API_TOKEN
    },

    function(data){

      hideLoading();


      if(
        !data ||
        !data.success
      ){

        showError(
          data && data.error
            ? data.error
            : "Gagal menyimpan verifikasi timbang."
        );

        return;
      }


      athlete.hasilTimbang =
        data.berat || "";


      athlete.statusTimbang =
        data.statusTimbang ||
        status;


      renderAthlete();


      alert(
        "Verifikasi timbang berhasil disimpan."
      );

    }

  );

}


/* =====================================================
   AWARD MEDALI / PIAGAM
===================================================== */

function award(type){

  const petugas =
    getPetugas();

  if(!petugas){
    return;
  }


  if(!athlete){
    return;
  }


  const current =
    type === "medali"
      ? athlete.medali
      : athlete.piagam;


  if(
    String(current)
      .toUpperCase() === "SUDAH"
  ){

    alert(
      type === "medali"
        ? "Medali sudah diambil."
        : "Piagam sudah diambil."
    );

    return;
  }


  const label =
    type === "medali"
      ? "medali"
      : "piagam";


  if(
    !confirm(
      "Konfirmasi pengambilan " +
      label +
      " untuk " +
      athlete.nama +
      "?"
    )
  ){

    return;
  }


  showLoading();


  api(

    type,

    {
      qr:
        athlete.qrUrl,

      petugas:
        petugas,

      token:
        API_TOKEN
    },

    function(data){

      hideLoading();


      if(
        !data ||
        !data.success
      ){

        showError(
          data && data.error
            ? data.error
            : "Gagal mencatat pengambilan."
        );

        return;
      }


      athlete[type] =
        "SUDAH";


      renderAthlete();


      alert(
        "Berhasil dicatat."
      );

    }

  );

}


/* =====================================================
   RESET
===================================================== */

function resetAthlete(){

  athlete = null;

  document
    .getElementById("card")
    .classList
    .add("hide");


  document
    .getElementById("nama")
    .textContent = "";


  document
    .getElementById("id")
    .textContent = "";


  document
    .getElementById("kontingen")
    .textContent = "";


  document
    .getElementById("kategori")
    .textContent = "";


  document
    .getElementById("gender")
    .textContent = "";


  document
    .getElementById("juara")
    .value = "";


  document
    .getElementById("berat")
    .value = "";


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =====================================================
   LOADING / ERROR
===================================================== */

function showLoading(){

  document
    .getElementById("loading")
    .style
    .display = "block";

}


function hideLoading(){

  document
    .getElementById("loading")
    .style
    .display = "none";

}


function showError(message){

  const element =
    document.getElementById("error");


  element.textContent =
    "⚠️ " + message;


  element.style.display =
    "block";

}


function clearError(){

  document
    .getElementById("error")
    .style
    .display = "none";

}


/* =====================================================
   TEST CONNECTION
===================================================== */

console.log(
  "SINC Athlete QR aktif."
);

console.log(
  "API:",
  API_URL
);

</script>

</body>
</html>
