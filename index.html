<!doctype html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<meta
  name="theme-color"
  content="#071426"
>

<title>
SINC Athlete QR - Petugas
</title>

<script
  src="https://unpkg.com/html5-qrcode"
></script>


<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:
    linear-gradient(
      135deg,
      #071426,
      #101d3a,
      #162d55
    );
  min-height:100vh;
  color:#111827;
}

.wrap{
  max-width:560px;
  margin:auto;
  padding:16px;
}

.card{
  background:#fff;
  padding:20px;
  border-radius:20px;
  margin-bottom:16px;
  box-shadow:
    0 8px 25px rgba(0,0,0,.18);
}

h1{
  margin-top:0;
  font-size:25px;
}

input,
select,
button{
  width:100%;
  padding:14px;
  margin-top:8px;
  border-radius:12px;
  font-size:16px;
  box-sizing:border-box;
}

input,
select{
  border:1px solid #ddd;
}

button{
  border:0;
  font-weight:bold;
  cursor:pointer;
}

button:disabled{
  opacity:.45;
  cursor:not-allowed;
}

.p{
  background:#111827;
  color:white;
}

.g{
  background:#16a34a;
  color:white;
}

.r{
  background:#dc2626;
  color:white;
}

.o{
  background:#d97706;
  color:white;
}

.b{
  background:#2563eb;
  color:white;
}

.v{
  background:#7c3aed;
  color:white;
}

.m{
  background:#e5e7eb;
  color:#111827;
}

.hide{
  display:none;
}

.status{
  padding:14px;
  border-radius:12px;
  margin-top:10px;
  font-weight:bold;
}

.ok{
  background:#dcfce7;
  color:#166534;
}

.no{
  background:#fee2e2;
  color:#991b1b;
}

.warn{
  background:#fef3c7;
  color:#92400e;
}

.msg{
  padding:12px;
  border-radius:12px;
  margin-bottom:12px;
  font-weight:bold;
}

.msg.okmsg{
  background:#dcfce7;
  color:#166534;
}

.msg.errmsg{
  background:#fee2e2;
  color:#991b1b;
}

.msg.waitmsg{
  background:#dbeafe;
  color:#1e40af;
}

.name{
  font-size:26px;
  font-weight:bold;
  margin-bottom:12px;
}

.info{
  margin:8px 0;
  line-height:1.45;
}

.info strong{
  display:inline-block;
  width:115px;
}

#reader{
  width:100%;
  margin-top:12px;
  overflow:hidden;
  border-radius:14px;
}

h3{
  margin-top:24px;
  margin-bottom:8px;
}

</style>

</head>


<body>

<div class="wrap">


<!-- ========================= -->
<!-- HEADER -->
<!-- ========================= -->

<div class="card">

<h1>
🏆 SINC Athlete QR
</h1>

<p>
Panel Petugas
</p>

<input
  id="petugas"
  placeholder="Nama petugas"
  autocomplete="off"
>

<button
  class="p"
  onclick="startScanner()"
>
📷 MULAI SCAN QR
</button>

<button
  id="stopButton"
  class="m hide"
  onclick="stopScanner()"
>
✖ TUTUP SCANNER
</button>

<div id="reader"></div>

</div>


<!-- ========================= -->
<!-- DATA ATLET -->
<!-- ========================= -->

<div
  id="card"
  class="card hide"
>

<div
  id="msg"
  class="msg"
>
</div>


<div
  id="nama"
  class="name"
>
</div>


<div class="info">
<strong>ID:</strong>
<span id="id"></span>
</div>


<div class="info">
<strong>Kontingen:</strong>
<span id="kontingen"></span>
</div>


<div class="info">
<strong>Kategori:</strong>
<span id="kategori"></span>
</div>


<div class="info">
<strong>Gender:</strong>
<span id="gender"></span>
</div>


<!-- ========================= -->
<!-- JUARA -->
<!-- ========================= -->

<h3>
🏆 Verifikasi Juara
</h3>

<select id="juara">

<option value="">
Pilih...
</option>

<option>
JUARA 1
</option>

<option>
JUARA 2
</option>

<option>
JUARA 3
</option>

<option>
JUARA 3 BERSAMA
</option>

<option>
FINALIS
</option>

<option>
TIDAK JUARA
</option>

</select>


<button
  class="v"
  onclick="saveJuara()"
>
🏆 SIMPAN STATUS JUARA
</button>


<!-- ========================= -->
<!-- TIMBANG -->
<!-- ========================= -->

<h3>
⚖️ Verifikasi Timbang
</h3>

<input
  id="berat"
  inputmode="decimal"
  placeholder="Hasil timbang (kg), opsional"
>


<button
  class="g"
  onclick="saveTimbang('LOLOS VERIFIKASI TIMBANG')"
>
🟢 LOLOS VERIFIKASI TIMBANG
</button>


<button
  class="r"
  onclick="saveTimbang('TIDAK LOLOS VERIFIKASI TIMBANG')"
>
🔴 TIDAK LOLOS VERIFIKASI TIMBANG
</button>


<div
  id="timbang"
  class="status warn"
>
⚖️ BELUM DIVERIFIKASI
</div>


<!-- ========================= -->
<!-- AWARD -->
<!-- ========================= -->

<h3>
🥇📜 Award
</h3>


<div
  id="medali"
  class="status no"
>
🥇 MEDALI: BELUM DIAMBIL
</div>


<button
  id="bm"
  class="o"
  onclick="award('medali')"
>
🥇 SERAHKAN MEDALI
</button>


<div
  id="piagam"
  class="status no"
>
📜 PIAGAM: BELUM DIAMBIL
</div>


<button
  id="bp"
  class="b"
  onclick="award('piagam')"
>
📜 SERAHKAN PIAGAM
</button>


<button
  class="m"
  onclick="resetAthlete()"
>
🔄 SCAN ATLET BERIKUTNYA
</button>

</div>

</div>


<script>

/* ==================================================
   CONFIG
================================================== */

const API =
'https://script.google.com/macros/s/AKfycbz2Gqo1Yhud50ODwXcoQokzEi3cF484EiTSz9FPp9JhtSiHBRZybTYKvsQsavDqAUGtwQ/exec';

const TOKEN =
'SINC-TOMOHON-2026';


let scanner = null;

let athlete = null;


/* ==================================================
   PETUGAS
================================================== */

function getPetugas(){

  const value =
    document
      .getElementById('petugas')
      .value
      .trim();

  if(!value){

    alert(
      'Masukkan nama petugas terlebih dahulu.'
    );

    return null;
  }

  return value;
}


/* ==================================================
   JSONP ENGINE
================================================== */

function apiRequest(
  action,
  params,
  success,
  failure
){

  const callbackName =
    'sincCallback_' +
    Date.now() +
    '_' +
    Math.floor(
      Math.random()*100000
    );


  let finished = false;


  const script =
    document.createElement('script');


  function cleanup(){

    clearTimeout(timeout);

    try{
      delete window[callbackName];
    }catch(e){
      window[callbackName] =
        undefined;
    }

    if(script.parentNode){
      script.parentNode.removeChild(script);
    }
  }


  window[callbackName] =
    function(data){

      if(finished) return;

      finished = true;

      cleanup();

      if(
        data &&
        data.success
      ){

        success(data);

      }else{

        failure(
          data &&
          data.error
            ? data.error
            : 'Server mengembalikan error.'
        );
      }
    };


  let url =
    API +
    '?action=' +
    encodeURIComponent(action) +
    '&callback=' +
    encodeURIComponent(callbackName);


  Object.keys(params || {})
    .forEach(function(key){

      const value =
        params[key];

      if(
        value !== undefined &&
        value !== null
      ){

        url +=
          '&' +
          encodeURIComponent(key) +
          '=' +
          encodeURIComponent(value);
      }

    });


  script.src = url;

  script.async = true;


  script.onerror =
    function(){

      if(finished) return;

      finished = true;

      cleanup();

      failure(
        'Request API gagal dimuat oleh browser. ' +
        'Coba refresh halaman lalu ulangi.'
      );
    };


  document.body.appendChild(script);


  const timeout =
    setTimeout(
      function(){

        if(finished) return;

        finished = true;

        cleanup();

        failure(
          'Server tidak memberikan respons. ' +
          'Periksa koneksi internet.'
        );

      },
      15000
    );
}


/* ==================================================
   SCANNER
================================================== */

function startScanner(){

  const p =
    getPetugas();

  if(!p) return;


  if(scanner){

    return;
  }


  scanner =
    new Html5Qrcode(
      'reader'
    );


  document
    .getElementById(
      'stopButton'
    )
    .classList
    .remove('hide');


  scanner
    .start(

      {
        facingMode:
          'environment'
      },

      {
        fps:10,

        qrbox:{
          width:250,
          height:250
        },

        aspectRatio:1
      },

      function(decodedText){

        if(!decodedText)
          return;


        stopScanner();

        lookupByQR(
          decodedText
        );
      },

      function(errorMessage){

        // Abaikan error scanning
        // karena callback ini dipanggil
        // terus-menerus selama scanning.
      }

    )
    .catch(function(error){

      scanner = null;

      document
        .getElementById(
          'stopButton'
        )
        .classList
        .add('hide');


      alert(
        'Kamera gagal dibuka.\n\n' +
        error
      );

    });
}


/* ==================================================
   STOP SCANNER
================================================== */

function stopScanner(){

  if(!scanner){

    document
      .getElementById(
        'stopButton'
      )
      .classList
      .add('hide');

    return;
  }


  const current =
    scanner;

  scanner = null;


  current
    .stop()
    .then(function(){

      try{
        current.clear();
      }catch(e){}

    })
    .catch(function(){

      try{
        current.clear();
      }catch(e){}

    });


  document
    .getElementById(
      'stopButton'
    )
    .classList
    .add('hide');
}


/* ==================================================
   LOOKUP QR
================================================== */

function lookupByQR(qr){

  showMessage(
    '⏳ Mengambil data atlet...',
    'waitmsg'
  );


  document
    .getElementById(
      'card'
    )
    .classList
    .remove('hide');


  apiRequest(

    'lookup',

    {
      qr: qr
    },

    function(data){

      athlete =
        data.athlete;

      renderAthlete();

      showMessage(
        '✅ Data atlet berhasil ditemukan.',
        'okmsg'
      );

    },

    function(error){

      showMessage(
        '⚠️ ' + error,
        'errmsg'
      );

    }

  );
}


/* ==================================================
   RENDER ATLET
================================================== */

function renderAthlete(){

  if(!athlete)
    return;


  document
    .getElementById('nama')
    .textContent =
      athlete.nama || '-';


  document
    .getElementById('id')
    .textContent =
      athlete.idAtlet || '-';


  document
    .getElementById('kontingen')
    .textContent =
      athlete.kontingen || '-';


  document
    .getElementById('kategori')
    .textContent =
      athlete.kategori || '-';


  document
    .getElementById('gender')
    .textContent =
      athlete.jenisKelamin || '-';


  const juara =
    String(
      athlete.statusJuara || ''
    )
    .toUpperCase();


  const validJuara = [

    'JUARA 1',
    'JUARA 2',
    'JUARA 3',
    'JUARA 3 BERSAMA',
    'FINALIS',
    'TIDAK JUARA'

  ];


  document
    .getElementById('juara')
    .value =
      validJuara.includes(
        juara
      )
      ? juara
      : '';


  document
    .getElementById('berat')
    .value =
      athlete.hasilTimbang || '';


  const timbang =
    String(
      athlete.statusTimbang ||
      'BELUM DIVERIFIKASI'
    )
    .toUpperCase();


  const timbangEl =
    document
      .getElementById(
        'timbang'
      );


  timbangEl.textContent =
    '⚖️ ' + timbang;


  timbangEl.className =
    'status ' +
    (
      timbang.includes('TIDAK')
        ? 'no'
        :
      timbang.includes('LOLOS')
        ? 'ok'
        :
        'warn'
    );


  const medaliSudah =
    String(
      athlete.medali || ''
    )
    .toUpperCase()
    === 'SUDAH';


  document
    .getElementById(
      'medali'
    )
    .textContent =
      medaliSudah
      ? '🥇 MEDALI: SUDAH DIAMBIL'
      : '🥇 MEDALI: BELUM DIAMBIL';


  document
    .getElementById(
      'bm'
    )
    .disabled =
      medaliSudah;


  const piagamSudah =
    String(
      athlete.piagam || ''
    )
    .toUpperCase()
    === 'SUDAH';


  document
    .getElementById(
      'piagam'
    )
    .textContent =
      piagamSudah
      ? '📜 PIAGAM: SUDAH DIAMBIL'
      : '📜 PIAGAM: BELUM DIAMBIL';


  document
    .getElementById(
      'bp'
    )
    .disabled =
      piagamSudah;


  document
    .getElementById(
      'card'
    )
    .scrollIntoView({
      behavior:'smooth',
      block:'start'
    });
}


/* ==================================================
   SAVE JUARA
================================================== */

function saveJuara(){

  const p =
    getPetugas();

  if(!p) return;


  const j =
    document
      .getElementById(
        'juara'
      )
      .value;


  if(!j){

    alert(
      'Pilih status juara terlebih dahulu.'
    );

    return;
  }


  if(!athlete){

    alert(
      'Belum ada atlet.'
    );

    return;
  }


  if(
    !confirm(
      'Simpan ' +
      j +
      ' untuk ' +
      athlete.nama +
      '?'
    )
  ){

    return;
  }


  showMessage(
    '⏳ Menyimpan status juara...',
    'waitmsg'
  );


  apiRequest(

    'juara',

    {

      qr:
        athlete.qrUrl,

      juara:
        j,

      petugas:
        p,

      token:
        TOKEN

    },


    function(data){

      athlete.statusJuara =
        data.juara;

      athlete.waktuJuara =
        data.waktu;

      athlete.petugasJuara =
        data.petugas;


      renderAthlete();


      showMessage(
        '✅ Status juara berhasil disimpan.',
        'okmsg'
      );

    },


    function(error){

      showMessage(
        '⚠️ ' + error,
        'errmsg'
      );

    }

  );
}


/* ==================================================
   SAVE TIMBANG
================================================== */

function saveTimbang(status){

  const p =
    getPetugas();

  if(!p) return;


  if(!athlete){

    alert(
      'Belum ada atlet.'
    );

    return;
  }


  const berat =
    document
      .getElementById(
        'berat'
      )
      .value
      .trim();


  if(
    !confirm(
      'Simpan hasil:\n\n' +
      status +
      '\n' +
      (berat
        ? 'Berat: ' + berat + ' kg'
        : 'Berat tidak diisi'
      )
    )
  ){

    return;
  }


  showMessage(
    '⏳ Menyimpan hasil timbang...',
    'waitmsg'
  );


  apiRequest(

    'timbang',

    {

      qr:
        athlete.qrUrl,

      berat:
        berat,

      statusTimbang:
        status,

      petugas:
        p,

      token:
        TOKEN

    },


    function(data){

      athlete.hasilTimbang =
        data.berat;

      athlete.statusTimbang =
        data.statusTimbang;

      athlete.waktuTimbang =
        data.waktu;

      athlete.petugasTimbang =
        data.petugas;


      renderAthlete();


      showMessage(
        '✅ Verifikasi timbang berhasil disimpan.',
        'okmsg'
      );

    },


    function(error){

      showMessage(
        '⚠️ ' + error,
        'errmsg'
      );

    }

  );
}


/* ==================================================
   AWARD
================================================== */

function award(type){

  const p =
    getPetugas();

  if(!p) return;


  if(!athlete){

    alert(
      'Belum ada atlet.'
    );

    return;
  }


  const current =
    String(
      type === 'medali'
        ? athlete.medali
        : athlete.piagam
    )
    .toUpperCase();


  if(current === 'SUDAH'){

    alert(
      type === 'medali'
        ? 'Medali sudah diambil.'
        : 'Piagam sudah diambil.'
    );

    return;
  }


  const label =
    type === 'medali'
      ? 'MEDALI'
      : 'PIAGAM';


  if(
    !confirm(
      'Konfirmasi ' +
      label +
      ' untuk:\n\n' +
      athlete.nama +
      '?'
    )
  ){

    return;
  }


  showMessage(
    '⏳ Mencatat pengambilan ' +
    label.toLowerCase() +
    '...',
    'waitmsg'
  );


  apiRequest(

    type,

    {

      qr:
        athlete.qrUrl,

      petugas:
        p,

      token:
        TOKEN

    },


    function(data){

      athlete[type] =
        'SUDAH';


      if(type === 'medali'){

        athlete.waktuMedali =
          data.waktu;

        athlete.petugasMedali =
          data.petugas;

      }else{

        athlete.waktuPiagam =
          data.waktu;

        athlete.petugasPiagam =
          data.petugas;

      }


      renderAthlete();


      showMessage(
        '✅ ' +
        label +
        ' berhasil dicatat.',
        'okmsg'
      );

    },


    function(error){

      showMessage(
        '⚠️ ' + error,
        'errmsg'
      );

    }

  );
}


/* ==================================================
   MESSAGE
================================================== */

function showMessage(
  text,
  type
){

  const el =
    document
      .getElementById(
        'msg'
      );


  el.textContent =
    text;


  el.className =
    'msg ' +
    (
      type ||
      ''
    );
}


/* ==================================================
   RESET
================================================== */

function resetAthlete(){

  athlete = null;


  document
    .getElementById(
      'card'
    )
    .classList
    .add('hide');


  document
    .getElementById(
      'msg'
    )
    .textContent =
      '';


  document
    .getElementById(
      'nama'
    )
    .textContent =
      '';


  document
    .getElementById(
      'id'
    )
    .textContent =
      '';


  document
    .getElementById(
      'kontingen'
    )
    .textContent =
      '';


  document
    .getElementById(
      'kategori'
    )
    .textContent =
      '';


  document
    .getElementById(
      'gender'
    )
    .textContent =
      '';


  window.scrollTo({
    top:0,
    behavior:'smooth'
  });
}

</script>

</body>
</html>
