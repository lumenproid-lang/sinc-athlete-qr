<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>SINC Athlete QR System</title>
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f4f6;color:#111827}
.wrap{max-width:560px;margin:auto;padding:16px}
.card{background:#fff;border-radius:20px;padding:20px;margin-bottom:16px;box-shadow:0 5px 18px rgba(0,0,0,.1)}
h1{margin:0;font-size:24px}
.sub{color:#6b7280;margin:6px 0 18px}
label{display:block;font-weight:700;margin-bottom:6px}
input,select{width:100%;padding:14px;border:1px solid #d1d5db;border-radius:12px;font-size:16px;margin-bottom:10px;background:#fff}
button{width:100%;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:700;margin-top:10px}
button:disabled{opacity:.5}
.primary{background:#111827;color:#fff}
.gold{background:#d97706;color:#fff}
.blue{background:#2563eb;color:#fff}
.purple{background:#7c3aed;color:#fff}
.muted{background:#e5e7eb;color:#111827}
#reader{margin-top:14px;border-radius:14px;overflow:hidden;background:#000}
.hidden{display:none!important}
.name{font-size:26px;font-weight:800;margin-bottom:14px}
.row{margin:9px 0}
.champ{margin-top:15px;padding:15px;border-radius:14px;background:#fff7ed;font-size:20px;font-weight:800}
.status{padding:14px;border-radius:14px;margin-top:12px}
.belum{background:#fee2e2;color:#991b1b}
.sudah{background:#dcfce7;color:#166534}
.status-label{font-size:13px;font-weight:700}
.status-value{font-size:20px;font-weight:800}
.msg{padding:12px;border-radius:12px;margin-bottom:12px;font-weight:700}
.ok{background:#dcfce7;color:#166534}
.err{background:#fee2e2;color:#991b1b}
.warn{background:#fef3c7;color:#92400e}
.small{color:#6b7280;font-size:13px;line-height:1.4;margin-top:10px}
.juara-edit{margin-top:14px;padding:14px;border-radius:14px;background:#f5f3ff}
</style>
</head>
<body>
<main class="wrap">
<section class="card">
<h1>🏆 SINC Athlete QR System</h1>
<div class="sub">Scanner Atlet • Juara • Medali • Piagam</div>

<label for="petugas">Nama Petugas</label>
<input id="petugas" type="text" placeholder="Contoh: Riyan" autocomplete="name">

<button id="startBtn" class="primary" onclick="startScanner()">📷 MULAI SCAN QR</button>
<button id="stopBtn" class="muted hidden" onclick="stopScanner()">✖ TUTUP SCANNER</button>
<div id="reader" class="hidden"></div>

<div class="small">Gunakan HTTPS dan izinkan akses kamera saat diminta browser.</div>
</section>

<section id="resultCard" class="card hidden">
<div id="message" class="msg hidden"></div>

<div id="nama" class="name"></div>
<div class="row"><b>ID Atlet:</b> <span id="idAtlet"></span></div>
<div class="row"><b>Kontingen:</b> <span id="kontingen"></span></div>
<div class="row"><b>Kategori:</b> <span id="kategori"></span></div>
<div class="row"><b>Jenis Kelamin:</b> <span id="jenisKelamin"></span></div>

<div class="champ">🏆 STATUS JUARA: <span id="statusJuara"></span></div>

<div class="juara-edit">
  <label for="juaraInput">Input / Edit Status Juara</label>
  <select id="juaraInput">
    <option value="">-- Pilih Status Juara --</option>
    <option>JUARA 1</option>
    <option>JUARA 2</option>
    <option>JUARA 3</option>
    <option>JUARA 3 BERSAMA</option>
    <option>FINALIS</option>
    <option>TIDAK JUARA</option>
  </select>
  <button id="juaraBtn" class="purple" onclick="simpanJuara()">🏆 SIMPAN STATUS JUARA</button>
</div>

<div id="medaliBox" class="status belum">
  <div class="status-label">🥇 MEDALI</div>
  <div id="medali" class="status-value">BELUM DIAMBIL</div>
</div>
<button id="medaliBtn" class="gold" onclick="ambilMedali()">🥇 SERAHKAN MEDALI</button>

<div id="piagamBox" class="status belum">
  <div class="status-label">📜 PIAGAM</div>
  <div id="piagam" class="status-value">BELUM DIAMBIL</div>
</div>
<button id="piagamBtn" class="blue" onclick="ambilPiagam()">📜 SERAHKAN PIAGAM</button>

<button class="muted" onclick="resetAtlet()">🔄 SCAN ATLET BERIKUTNYA</button>
</section>
</main>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbz2Gqo1Yhud50ODwXcoQokzEi3cF484EiTSz9FPp9JhtSiHBRZybTYKvsQsavDqAUGtwQ/exec';
const API_TOKEN = 'SINC-TOMOHON-2026';
let scanner = null;
let scannerRunning = false;
let athlete = null;

function msg(text,type){
  const e=document.getElementById('message');
  e.textContent=text;
  e.className='msg '+type;
  e.classList.remove('hidden');
}

function getPetugas(){
  const v=document.getElementById('petugas').value.trim();
  if(!v){alert('Masukkan nama petugas terlebih dahulu.');return null;}
  return v;
}

function startScanner(){
  if(!getPetugas()) return;
  document.getElementById('reader').classList.remove('hidden');
  document.getElementById('startBtn').classList.add('hidden');
  document.getElementById('stopBtn').classList.remove('hidden');

  scanner=new Html5Qrcode('reader');
  scannerRunning=true;

  scanner.start(
    {facingMode:'environment'},
    {fps:10,qrbox:{width:250,height:250}},
    function(text){
      if(!scannerRunning)return;
      scannerRunning=false;
      stopScanner();
      lookup(text);
    },
    function(_){
    }
  ).catch(function(err){
    msg('Kamera tidak dapat dibuka: '+err,'err');
    document.getElementById('reader').classList.add('hidden');
    document.getElementById('startBtn').classList.remove('hidden');
    document.getElementById('stopBtn').classList.add('hidden');
  });
}

function stopScanner(){
  document.getElementById('reader').classList.add('hidden');
  document.getElementById('startBtn').classList.remove('hidden');
  document.getElementById('stopBtn').classList.add('hidden');

  if(scanner){
    const s=scanner;
    scanner=null;
    s.stop().then(function(){
      try{s.clear()}catch(e){}
    }).catch(function(){});
  }
  scannerRunning=false;
}

function jsonp(action,params,done){
  const cb='cb_'+Date.now()+'_'+Math.floor(Math.random()*1e6);
  const script=document.createElement('script');

  window[cb]=function(data){
    try{done(data)}finally{
      delete window[cb];
      script.remove();
    }
  };

  const q=new URLSearchParams();
  q.set('action',action);
  q.set('callback',cb);

  Object.keys(params||{}).forEach(function(k){
    q.set(k,params[k]);
  });

  script.src=API_URL+'?'+q.toString();

  script.onerror=function(){
    delete window[cb];
    script.remove();
    msg('Tidak dapat terhubung ke server.','err');
  };

  document.body.appendChild(script);
}

function lookup(qr){
  msg('🔎 Membaca data atlet...','warn');

  jsonp('lookup',{qr:qr},function(data){
    if(!data||!data.success||!data.athlete){
      document.getElementById('resultCard').classList.add('hidden');
      msg('❌ '+(data&&data.error?data.error:'Atlet tidak ditemukan.'),'err');
      return;
    }

    athlete=data.athlete;
    render();
    document.getElementById('resultCard').classList.remove('hidden');
    msg('✅ Atlet ditemukan.','ok');
  });
}

function render(){
  document.getElementById('nama').textContent=athlete.nama||'';
  document.getElementById('idAtlet').textContent=athlete.idAtlet||'';
  document.getElementById('kontingen').textContent=athlete.kontingen||'';
  document.getElementById('kategori').textContent=athlete.kategori||'';
  document.getElementById('jenisKelamin').textContent=athlete.jenisKelamin||'';
  document.getElementById('statusJuara').textContent=athlete.statusJuara||'BELUM DITENTUKAN';

  const select=document.getElementById('juaraInput');
  const current=String(athlete.statusJuara||'').toUpperCase();
  let found=false;
  for(let i=0;i<select.options.length;i++){
    if(select.options[i].value===current){
      select.value=current;
      found=true;
      break;
    }
  }
  if(!found) select.value='';

  status('medali',athlete.medali);
  status('piagam',athlete.piagam);
}

function status(type,val){
  const done=String(val||'BELUM').toUpperCase()==='SUDAH';
  const box=document.getElementById(type+'Box');
  const btn=document.getElementById(type+'Btn');
  const lab=document.getElementById(type);

  box.className='status '+(done?'sudah':'belum');
  lab.textContent=done?'SUDAH DIAMBIL':'BELUM DIAMBIL';
  btn.disabled=done;

  btn.textContent=done
    ? (type==='medali'?'✅ MEDALI SUDAH DIAMBIL':'✅ PIAGAM SUDAH DIAMBIL')
    : (type==='medali'?'🥇 SERAHKAN MEDALI':'📜 SERAHKAN PIAGAM');
}

function simpanJuara(){
  if(!athlete) return;

  const petugas=getPetugas();
  if(!petugas) return;

  const juara=document.getElementById('juaraInput').value.trim();

  if(!juara){
    alert('Pilih status juara terlebih dahulu.');
    return;
  }

  if(!confirm('Simpan status "'+juara+'" untuk '+athlete.nama+'?')) return;

  msg('⏳ Menyimpan status juara...','warn');

  jsonp('juara',{
    qr:athlete.qrUrl,
    juara:juara,
    petugas:petugas,
    token:API_TOKEN
  },function(data){
    if(!data||!data.success){
      msg('❌ '+(data&&data.error?data.error:'Gagal menyimpan status juara.'),'err');
      return;
    }

    athlete.statusJuara=juara;
    render();
    msg('✅ Status juara berhasil disimpan.','ok');
  });
}

function ambilMedali(){
  if(!athlete)return;

  const p=getPetugas();
  if(!p)return;

  if(String(athlete.medali).toUpperCase()==='SUDAH'){
    alert('Medali atlet ini sudah diambil.');
    return;
  }

  if(!confirm('Serahkan medali kepada '+athlete.nama+'?'))return;

  msg('⏳ Menyimpan pengambilan medali...','warn');

  jsonp('medali',{qr:athlete.qrUrl,petugas:p,token:API_TOKEN},function(data){
    if(!data||!data.success){
      msg('❌ '+(data&&data.error?data.error:'Gagal mencatat medali.'),'err');
      return;
    }

    athlete.medali='SUDAH';
    render();
    msg('✅ Medali berhasil dicatat.','ok');
  });
}

function ambilPiagam(){
  if(!athlete)return;

  const p=getPetugas();
  if(!p)return;

  if(String(athlete.piagam).toUpperCase()==='SUDAH'){
    alert('Piagam atlet ini sudah diambil.');
    return;
  }

  if(!confirm('Serahkan piagam kepada '+athlete.nama+'?'))return;

  msg('⏳ Menyimpan pengambilan piagam...','warn');

  jsonp('piagam',{qr:athlete.qrUrl,petugas:p,token:API_TOKEN},function(data){
    if(!data||!data.success){
      msg('❌ '+(data&&data.error?data.error:'Gagal mencatat piagam.'),'err');
      return;
    }

    athlete.piagam='SUDAH';
    render();
    msg('✅ Piagam berhasil dicatat.','ok');
  });
}

function resetAtlet(){
  athlete=null;
  document.getElementById('resultCard').classList.add('hidden');
  window.scrollTo({top:0,behavior:'smooth'});
}
</script>
</body>
</html>
